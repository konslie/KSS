스에 CPNG buyback 및 risk-reward 관련 제목이 포함됐으나 최근 종가는 수집되지 않았다."], ["Rocket Lab", "중립", "확인 필요\u003cbr\u003e직전 $114.70", "", "", "▇▇▆▂▂▁▁", "yfinance 뉴스에 SpaceX IPO 기대와 우주주 약세가 함께 포함됐고, 최근 종가는 수집되지 않았다."], ["Resolve AI", "중립", "확인 필요\u003cbr\u003e직전 $2.565", "", "", "▁▄▇▆▅▁▁", "yfinance 뉴스에 2026년 매출 가이던스 재확인, TCS 제휴, Commerce.com 거래 관련 제목이 포함됐고 최근 종가는 수집되지 않았다."], ["Intuitive Machines", "중립", "확인 필요\u003cbr\u003e직전 $33.83", "", "", "▃▇▆▄▄▁▁", "yfinance 뉴스에 LUNR 6개월 상승률, SpaceX IPO 영향, 우주주 변동성 관련 제목이 포함됐고 최근 종가는 수집되지 않았다."]]}, {"type": "paragraph", "text": "영향도 기준: 긍정은 가격·수급·뉴스/공시가 함께 우호적인 경우, 중립은 신호가 혼재하거나 최근 종가 확인이 필요한 경우, 부정은 가격 약세·외인/기관 매도·부정적 뉴스가 겹친 경우로 분류했다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "**금융주는 시장 급락 속 방어 성격이 확인된 구간**이었다. **하나금융지주**와 **우리금융지주**는 가격 강세와 기관·외인 수급이 같은 방향으로 움직여, 단순 반등이라기보다 당일 국내 위험 회피 흐름 안에서도 은행주 쪽으로 수급이 붙은 신호로 해석된다. 다만 Naver Search 뉴스에는 금융지주 자체 호재보다 시장 급락, 환율, 금융권 이슈가 섞여 있어 개별 기업 실적 모멘텀으로 단정하기보다는 **상대 강도와 수급 확인**에 무게를 둔다.", "autoBold": true}, {"type": "paragraph", "text": "반대로 **DB손해보험**은 기관·외인이 모두 순매도였고 DART 공시도 채무증권 증권신고서 정정 및 발행조건확정 중심이었다. 같은 금융 섹터 안에서도 은행지주와 보험주의 당일 수급 방향이 갈렸기 때문에, 금융주 전체가 강했다기보다 **은행지주 쏠림과 보험주 부담이 분리된 장세**로 보는 편이 더 정확하다. **SCHD** 관련 yfinance 뉴스는 배당 ETF 비교와 은퇴 포트폴리오 성격이어서 국내 금융주 수급과 직접 연결하기보다는 방어형 배당 자산의 별도 참고 신호로 둔다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW 1,541원대**와 Naver Search의 환율 경계 뉴스는 수출주에 우호적으로만 읽기 어렵다. 원화 약세가 자동차 수출 채산성에는 일부 완충 요인이 될 수 있지만, 당일 **현대차2우B**에서는 기관과 외인이 함께 순매도해 환율 효과보다 국내 위험 회피와 외국인 자금 이탈 신호가 더 강하게 반영됐다.", "autoBold": true}, {"type": "paragraph", "text": "DART 공시는 **영업잠정실적**, **기업가치제고계획**, **기업지배구조보고서**가 함께 잡혔다. 따라서 현대차2우B 문단의 핵심은 “가격 하락” 자체가 아니라, 환율 변수와 주주환원·기업가치 공시가 있음에도 당일 수급이 방어하지 못했다는 점이다. 다음 확인 포인트는 공시 내용이 실제 배당·자사주·실적 기대를 얼마나 보강하는지와, 외인 매도가 일회성인지 7거래일 흐름으로 이어지는지다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "**반도체는 가격보다 수급의 결이 더 중요했다.** 필라델피아반도체지수 약세와 국내 증시 급락 뉴스가 같이 나온 가운데, **삼성전자**는 외인 순매도 1.4조가 가격 약세를 확인했다. CNBC Markets와 Naver Search에는 AI 연계주 약세, 외국인 매도, Jensen Huang 방한 관련 이슈가 섞여 있어, 삼성전자는 “AI 기대”보다 **국내 대형 반도체에서 외국인 리스크가 먼저 가격화된 신호**로 보는 것이 맞다.", "autoBold": true}, {"type": "paragraph", "text": "**이수페타시스**는 더 미묘하다. 가격은 크게 밀렸지만 외인은 1,252억 순매수였고, 뉴스에는 장중 급락과 반도체 소부장 관련 제목이 함께 있었다. 이는 삼성전자처럼 수급과 가격이 같은 방향으로 무너진 사례가 아니라, **주가 약세와 외인 매수가 충돌한 사례**다. 단기적으로는 변동성이 크지만, 외인 매수가 하락 방어인지 저가 매수인지 구분하려면 후속 수급과 관련 뉴스의 직접성을 봐야 한다. **Nvidia**는 반등했지만 AI 기대치 부담 뉴스가 남아 있어, 미국 AI 대장주와 국내 반도체 수급이 같은 날 같은 방향으로 움직였다고 보기는 어렵다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "**미국 포트폴리오는 종목별 뉴스의 질과 최근 종가 수집 상태를 분리해서 봐야 한다.** **Apple**, **Nvidia**, **SCHD**는 최근 종가가 수집됐지만, Apple 뉴스에는 Broadcom sell-off처럼 직접성이 약한 제목도 포함되어 있어 Apple 자체 영향으로 과대 해석하면 안 된다. Nvidia는 가격 반등과 AI 기대치 부담 뉴스가 공존하므로, 당일 반등은 확인되지만 AI 밸류에이션 부담이 사라졌다고 보기는 어렵다.", "autoBold": true}, {"type": "paragraph", "text": "**Coupang**, **Rocket Lab**, **Resolve AI**, **Intuitive Machines**는 최근 종가가 비어 있어 영향도 확신을 낮춰야 한다. yfinance 뉴스 기준으로 Coupang은 buyback과 risk-reward 재평가, Rocket Lab과 Intuitive Machines는 SpaceX IPO 및 우주주 변동성, Resolve AI는 2026년 매출 가이던스와 TCS 제휴가 핵심 이슈다. 이 구간은 가격 변화보다 **사업 이벤트가 후속 가격에 반영되는지 확인해야 하는 뉴스 대기 구간**으로 보는 것이 적절하다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "list", "items": ["**DART:** 총 25건 수집. 현대차2우B 7건, 하나금융지주 4건, 우리금융지주 1건, 삼성전자 10건, DB손해보험 3건."], "autoBold": false}, {"type": "list", "items": ["**CNBC Markets:** 한국 증시 급락, Jensen Huang 방한 관심, 중국 AI 인재 이동, 바이오 M\u0026A, 페르시아만 선박·이란 관련 뉴스가 포함됐다."], "autoBold": false}, {"type": "list", "items": ["**Naver Search:** 코스피 5%대 급락, 외국인 매도, 원/달러 환율 1540원 위협, 반도체 소부장, 이수페타시스 하락 관련 제목이 포함됐다."], "autoBold": false}, {"type": "list", "items": ["**yfinance:** SCHD 배당 ETF, Apple App Store, Nvidia/AI 기대치 부담, Coupang buyback, 우주주와 SpaceX IPO, Rezolve AI 관련 뉴스가 포함됐다."], "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **KOSPI 외국인 순매도 3.5조**와 삼성전자 외인 순매도 1.4조가 국내 위험 신호의 중심이다.", "autoBold": false}, {"type": "paragraph", "text": "2. **금융주는 시장 급락 속에서도 상대 강세**를 보였고 하나금융지주·우리금융지주는 기관/외인 수급도 우호적이었다.", "autoBold": false}, {"type": "paragraph", "text": "3. **USD/KRW 1,541.28**은 수출주와 외국인 수급 해석에서 계속 확인해야 할 변수다.", "autoBold": false}, {"type": "paragraph", "text": "4. **미국 AI/우주 성장주 뉴스는 혼재**되어 있으며 일부 종목은 최근 종가가 수집되지 않아 확인 필요다.", "autoBold": false}, {"type": "paragraph", "text": "5. **DART 공시가 많은 종목**은 현대차2우B, 삼성전자, 하나금융지주, DB손해보험이다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["KRX Open API는 HTTP 401 Unauthorized로 보조 데이터가 수집되지 않았다."], "autoBold": false}, {"type": "list", "items": ["KRX investor flow Open API path는 설정되지 않았다."], "autoBold": false}, {"type": "list", "items": ["국내 KRX 가격, KOSPI/KOSDAQ 지수, 개인/기관/외국인 수급은 pykrx 기준으로 수집됐다."], "autoBold": false}, {"type": "list", "items": ["Coupang, Rocket Lab, Resolve AI, Intuitive Machines는 yfinance 최근 종가가 비어 있어 직전 수집 종가와 뉴스만 사용했다."], "autoBold": false}]}, "view_model": {"schema": "kss-view-model.v1", "date": "2026-06-05", "as_of": "2026-06-06T00:26:51.339160+09:00", "timezone": "Asia/Seoul", "market_status": {"label": "위험", "score": 4, "reasons": ["KOSPI 급락", "KOSDAQ 급락", "환율 상승", "VIX 상승"], "reason": "KOSPI 급락 · KOSDAQ 급락"}, "market_indicators": [{"name": "KOSPI", "symbol": "^KS11", "source": "pykrx_fallback", "as_of_date": "2026-06-05", "display_order": 0, "unit": "index", "risk_tags": ["시장 약세"], "short_comment": "급락", "price": {"latest_close": 8160.59, "previous_close": 8639.4102, "close_7d_ago": 8228.7002, "recent_closes": [8228.7002, 8185.29, 8476.1504, 8788.3799, 8801.4902, 8639.4102, 8160.59], "recent_dates": ["2026-05-27", "2026-05-28", "2026-05-29", "2026-06-01", "2026-06-02", "2026-06-04", "2026-06-05"], "change": -478.8202, "change_pct": -5.5423, "trend": "down"}, "
