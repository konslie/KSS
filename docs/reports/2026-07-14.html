eading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "**하나금융지주**와 **DB손해보험**은 시장 급락 속에서도 가격이 상승했고, 기관 순매수가 확인됐다. 하나금융지주는 청라 시대 개막 뉴스와 은행주 순환매 뉴스가 함께 수집됐으며, DB손해보험은 보험계약대출 증가 조짐과 계열금융회사 약관 금융거래 공시가 확인됐다. 다만 두 종목 모두 외국인 수급은 순매도로 집계돼, 가격 방어가 외국인 매수로 뒷받침된 흐름은 아니다.", "autoBold": true}, {"type": "paragraph", "text": "**우리금융지주**는 직전 거래일 대비 -0.79%였지만 7거래일 기준으로는 +1.46%다. 기관은 순매수였고 외국인은 순매도였으며, 수집 뉴스에는 금융주 선방과 미래에셋증권 순익 전망이 우리금융과 비교되는 내용이 포함됐다. **SCHD**는 가격이 소폭 상승했고 배당 ETF 관련 뉴스가 수집됐지만, 미국 ETF라 국내 수급 확인은 불가능하다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW**는 1,497.02로 직전 거래일 대비 -0.59%였고, 7거래일 기준으로도 하락 흐름이다. 환율 자체는 현대차2우B에 단기 부담으로 확인되지는 않았지만, 현대차2우B 가격은 200,000원으로 -1.96% 하락했다. 당일 수급은 외국인 순매수 45억, 기관 순매도 64억으로 엇갈렸고, 7거래일 누적으로는 외국인 -27억, 기관 -152억이었다.", "autoBold": true}, {"type": "paragraph", "text": "수집 뉴스는 **2분기 실적 하회 예상**, **로봇 모멘텀**, **아이오닉5 미국 전기차 판매**에 집중됐다. DART 공시는 생산중단, 특수관계인으로부터 기타유가증권 매수, IR 개최로 분류되며, 주주환원보다는 운영 이벤트와 지배구조·관계거래 확인 성격이 더 크다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "**삼성전자**는 가격 -10.70%, 외국인 -1,875억, 기관 -8,527억으로 가격과 수급이 같은 약세 방향이었다. DART에는 자기주식처분결정, 자기주식처분결과, 주요주주 특정증권 소유상황, 대량보유상황, IR, 잠정실적 공시가 다수 수집됐다. 이는 단일 뉴스보다 공시 이벤트와 대형 수급 부담을 함께 확인해야 하는 구간이다.", "autoBold": true}, {"type": "paragraph", "text": "**이수페타시스**는 가격 -4.05%, 외국인 -315억이었지만 기관은 +471억이었다. 수집 뉴스는 반도체 쇼크, 기관의 기판·금융주 집중 매수, 외국인의 IT 부품·지주사 이동을 가리킨다. **Nvidia**는 당일 -3.52%였고, yfinance_news에는 메모리칩 수요·공급 불균형 관련 기사가 수집됐다. 필라델피아반도체지수도 -4.78%였기 때문에, AI 기대 관련 뉴스가 있었음에도 단기 가격 신호는 국내외 반도체 모두 약했다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "**Apple**과 **SCHD**는 직전 거래일 대비 상승했고 7거래일 기준으로도 상승세였다. Apple 관련 뉴스는 개인투자자의 Apple·Tesla·반도체주 현금화에 초점이 있었고, SCHD 관련 뉴스는 배당 ETF의 성과와 AI 인플레이션 경고를 다뤘다. 두 항목 모두 국내 수급 데이터는 없으므로 가격과 뉴스만 확인 근거로 삼아야 한다.", "autoBold": true}, {"type": "paragraph", "text": "**Coupang**, **Rocket Lab**, **Resolve AI**, **Intuitive Machines**는 모두 당일 가격이 하락했다. Coupang은 애널리스트 시각 기사들이 수집됐지만 가격은 -4.68%였고, Rocket Lab은 80억 달러 Iridium 인수 뉴스와 우주주 약세 뉴스가 동시에 있었다. Intuitive Machines는 최근 한 달 하락과 NASA ETF 보유 확대 뉴스가 함께 수집됐고, Resolve AI는 블록체인 데이터 구조 수요 관련 뉴스가 있었지만 가격 흐름은 약세였다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "list", "items": ["**시장·매크로**: CNBC Markets의 [Trump proposes 20% toll on cargo through Strait of Hormuz; restarts Iran blockade](https://www.cnbc.com/2026/07/13/trump-iran-hormuz-strait-charge-reimburse.html)와 [UN maritime agency opposes Hormuz transit fees after Trump demands protection money](https://www.cnbc.com/2026/07/13/imo-maritime-organization-strait-hormuz-tolls-trump-iran.html)는 해상 물류·에너지 비용 리스크로 분류된다."], "autoBold": false}, {"type": "list", "items": ["**금융주**: naver_search_news의 [하나금융, 청라 시대 연다…'새로운 100년' 금융 대전환 시동](http://www.newsian.co.kr/news/articleView.html?idxno=92174), [[N2 포커스] 반도체 흔들리자 은행주 신고가…순환매 타고 랠리 이어질...](https://www.news2day.co.kr/article/20260714500006), [금융주, 검은월요일에도 '선방'···시장 선택은 함영주號 하나금융 [금...](https://www.fntimes.com/html/view.php?ud=202607132157137753b4a7c6999c_18)가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["**자동차·환율**: naver_search_news의 [현대차 실적 하회 예상과 로봇 모멘텀 기사](https://www.edaily.co.kr/news/newspath.asp?newsid=02473126645514520), [현대차 아이오닉5, 미 전기차 시장서 테슬라 제외 판매 1위](https://theopiniontimes.news/%ed%98%84%eb%8c%80%ec%b0%a8-%ec%95%84%ec%9d%b4%ec%98%a4%eb%8b%895-%eb%af%b8-%ec%a0%84%ea%b8%b0%ec%b0%a8-%ec%8b%9c%ec%9e%a5%ec%84%9c-%ed%85%8c%ec%8a%ac%eb%9d%bc-%ec%a0%9c%ec%99%b8-%ed%8c%90%eb%a7%a4-1/)가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["**반도체**: naver_search_news의 [[26.7.13 증시 인싸잇] 코스피 43거래일 만에 7000선 붕괴… 반도체 쇼크](https://www.mediawatch.kr/news/article.html?no=260361), [[코스피 지수선물 옵션] 주식선물도 '반도체 쇼크'…삼성전자·SK하이닉...](https://www.pinpointnews.co.kr/news/articleView.html?idxno=468060), [[거래소 외국인] SK하이닉스·삼성전자 폭풍매도… IT 부품·지주사로 눈...](https://ww
