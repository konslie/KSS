, "$2.53\u003cbr\u003e+$0.14 (+5.86%)", "", "", "주가 -1.36%", "Simply Wall St.는 2026년 매출 가이던스와 TCS 제휴를 성장 기대와 밸류에이션 우려로 함께 다뤘다. 뉴스가 오래돼 당일 반등과의 직접 연결은 제한적이다."], ["Intuitive Machines", "중립~긍정", "$30.64\u003cbr\u003e+$4.11 (+15.47%)", "", "", "주가 -9.43%", "Barron's·TechCrunch·Stocktwits는 SpaceX IPO 경쟁 부담과 우주 섹터 기대를 함께 전했다. 급반등에도 7일 약세여서 경쟁 뉴스의 영향은 **확인 필요**다."]]}, {"type": "heading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "**하나금융지주**는 가격이 약했지만 외국인은 55억원 순매수했고 7거래일 외국인 누계도 123억원 순매수였다. 반면 기관은 121억원 순매도했다. 수집 뉴스는 CEO 브랜드평판과 iM금융지주 행동주의 이슈가 중심이라 하나금융의 실적·자본정책에 직접 연결되는 근거는 제한적이다. 가격 약세를 외국인 수급이 확인하지 않은 점이 핵심이다.", "autoBold": true}, {"type": "paragraph", "text": "**우리금융지주**는 DART의 주식소각 정정, 자기주식취득 신탁 해지 결과, IR 개최 공시로 주주환원·기업가치 소통을 확인할 수 있다. 당일 기관 순매수와 가격 상승은 같은 방향이지만 외국인은 당일과 7일 누계 모두 순매도다. **DB손해보험**은 K-ICS 비율 개선 뉴스와 신종자본증권 관련 공시가 자본 여력을 보여주는 한편, 경상환자 8주 규정 지연 뉴스는 손해율 개선 시점의 불확실성을 남겼다. 외국인 매도까지 겹쳐 금융주 안에서도 보험주의 부담이 더 컸다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW 최근 종가**는 1,516.01원으로 직전 거래일 대비 -0.64%였다. 원화 강세 방향은 수출 채산성 측면에서 단순 우호 신호로 보기 어렵고, **현대차2우B**에서는 외국인이 91억원 순매도해 기관 순매수를 압도했다. 7거래일 외국인 누계도 410억원 순매도라 가격 약세와 외국인 수급이 같은 방향이다.", "autoBold": true}, {"type": "paragraph", "text": "Naver Search의 현대차그룹 스타트업 분사 뉴스는 SDV 등 신사업 육성 흐름을 보여주지만 우선주 가치에 미치는 직접 영향은 **확인 필요**다. DART의 특수관계인 유가증권 매수와 출자 공시는 지배구조·그룹 내 자본거래 축의 확인 사항이며, 가격과 수급 부담을 상쇄할 실적 정보로 해석해서는 안 된다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "**필라델피아반도체지수**와 **Nvidia**가 강세를 보였고 Naver Search에는 AI·반도체 인력 수요와 미국 위험 선호 회복을 다룬 뉴스가 포함됐다. 그러나 **삼성전자**는 기관이 1.62조원 순매도했고 7거래일 외국인 누계도 11.57조원 순매도여서 글로벌 반도체 반등과 국내 대형주의 수급은 같은 방향이 아니었다. DART 공시는 최대주주·임원 지분 변동 중심으로, 실적 개선을 직접 확인하는 자료는 아니다.", "autoBold": true}, {"type": "paragraph", "text": "**이수페타시스**는 기관 1,102억원 순매수가 급등을 뒷받침했지만 외국인은 847억원 순매도했고, Naver Search는 국민연금이 일부 지분을 낮췄다는 기사도 전했다. AI 기판 기대가 가격에 반영된 날이지만 외국인·장기 보유 주체의 움직임은 충돌한다. 반도체 반등의 지속성은 삼성전자 외국인 수급과 이수페타시스의 기관·외국인 방향이 다시 맞춰지는지로 확인해야 한다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "**Coupang**은 개인정보 침해 관련 4억달러대 과징금이 핵심 이슈다. TechCrunch와 GuruFocus는 제재 규모를 강조했고 Motley Fool은 최악의 우려보다 낮았다는 평가를 주가 급등과 연결했다. 규제 불확실성이 일부 해소된 가격 반응으로 볼 여지는 있지만, 수집 자료만으로 비용의 장기 영향까지 판단할 수는 없다.", "autoBold": true}, {"type": "paragraph", "text": "**Rocket Lab**과 **Intuitive Machines**는 당일 크게 반등했지만 CNBC Markets는 SpaceX IPO의 높은 기업가치와 Starlink 성장 둔화, 경쟁·감독 이슈를 동시에 전했다. 우주 섹터 관심 확대는 우호적일 수 있으나 SpaceX의 자본 조달과 경쟁력은 상장 우주기업에 부담이 될 수도 있다. **Apple**은 Siri 개선 기대와 남은 의문이 함께 제기됐고, **Nvidia**는 반도체지수 반등에도 7일 약세다. **Resolve AI** 뉴스는 5월~6월 초 자료가 중심이라 당일 가격과의 직접 관련성은 낮다. **SCHD**는 가격과 기사 모두 새로운 위험 신호가 제한적이다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "list", "items": ["**DART:** 우리금융지주의 주식소각 정정·자기주식 신탁 해지·IR, DB손해보험의 증권발행실적·투자설명서, 현대차의 특수관계인 자본거래, 삼성전자의 최대주주·임원 지분 변동 공시가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["**Naver Search:** DB손해보험의 K-ICS와 경상환자 규정, 이수페타시스의 기관 주도 반등과 국민연금 지분 축소, 현대차그룹의 SDV 스타트업 분사 등이 주요 직접 이슈다. 현대바이오 검색 결과 일부는 종목 직접 관련성이 낮아 **확인 필요**다."], "autoBold": false}, {"type": "list", "items": ["**yfinance 뉴스:** Coupang 과징금, Apple Siri, Nvidia 정부업무 책임자 영입, Rocket Lab 발사 준비, SpaceX IPO와 우주 섹터 경쟁 이슈가 포함됐다."], "autoBold": false}, {"type": "list", "items": ["**CNBC Markets:** 이란 관련 합의 가능성, 유가, SpaceX IPO 가치평가·감독·Starlink 성장, 금 시장을 다뤘다."], "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **삼성전자:** 필라델피아반도체지수 강세가 국내 외국인 수급 개선으로 이어지는지 확인한다.", "autoBold": false}, {"type": "paragraph", "text": "2. **이수페타시스:** 기관 주도 급등 뒤 외국인 순매도가 계속되는지, 수급 주체가 합류하는지 본다.", "autoBold": false}, {"type": "paragraph", "text": "3. **Coupang:** 과징금 규모가 알려진 뒤의 반등이 유지되는지와 추가 규제 뉴스 여부를 구분해 본다.", "autoBold": false}, {"type": "paragraph", "text": "4. **우주주:** SpaceX IPO 기대가 Rocket Lab·Intuitive Machines의 섹터 관심 확대와 경쟁 부담 중 어느 쪽으로 반영되는지 확인한다.", "autoBold": false}, {"type": "paragraph", "text": "5. **금융주:** 우리금융의 주주환원 공시와 DB손해보험의 자본 확충 뉴스가 외국인 수급으로 확인되는지 본다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["국내·미국 보유주 15개와 주요 지표의 가격이 모두 채워졌으며, 주식 가격은 **가장 최근 유효 거래일인 2026-06-11 종가**를 사용했다."], "autoBold": false}, {"type": "list", "items": ["뉴스 50건, DART 공시 14건, 국내 보유주 8개의 종목별 투자자 수급이 수집됐다."], "autoBold": false}, {"type": "list", "items": ["선택 KRX 참조 데이터 일부는 수집되지 않았지만 국내 종가·지수·종목별 수급은 다른 수집 출처로 보완됐다."], "autoBold": false}, {"type": "list", "items": ["2026-06-12 장 시작 전 시장 전체 당일 수급은 0으로 표시돼 해석 근거에서 제외했다. 종목별 수급은 2026-06-11 기준, 시장 7거래일 누계는 유효한 값만 참고했다."], "autoBold": false}, {"type": "list", "items": ["일부 검색 뉴스는 종목과의 직접 관련성이 낮거나 제목만으로 영향 판단이 어려워 **확인 필요**로 표시했다."], "autoBold": false}]}, "view_model": {"schema": "kss-view-model.v1", "date": "2026-06-12", "as_of": "2026-06-12T07:32:23.519701+09:00", "timezone": "Asia/Seoul", "market_status": {"label": "중립", "score": 0, "reasons": [], "reason": ""}, "market_indicators": [{"name": "KOSPI", "symbol": "^KS11", "source": "pykrx_fallback", "as_of_date": "2026-06-11", "display_order": 0, "unit": "index", "risk_tags": [], "short_comment": "보합권", "price": {"latest_close": 7763.95, "previous_close": 7730.8198, "close_7d_ago": 8801.4902, "recent_closes": [8801.4902, 8639.4102, 8160.5898, 7484.4102, 8096.9302, 7730.8198, 7763.95], "recent_dates": ["2026-06-02", "2026-06-04", "2026-06-05", "2026-06-08", "2026-06-09", "2026-06-10", "2026-06-11"], "change": 33.1302, "change_pct": 0.4285, "trend": "down_7d"}, "volume": 478729575}, {"name": "KOSDAQ", "symbol": "^KQ11", "source": "pykrx_fallback", "as_of_date": "2026-06-11", "display_order": 1, "unit": "index", "risk_tags": ["시장 강세"], "short_comment": "강세", "price": {"latest_close": 996.93, "previous_close": 951.63, "close_7d_ago": 1026.03, "recent_closes": [1026.03, 1049.73, 1002.44, 911.39, 967.81, 951.63, 996.93], "recent_dates": ["2026-06-02", "
