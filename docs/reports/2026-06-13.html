.79%)", "", "", "주가 -14.64%", "yfinance 뉴스는 SpaceX 상장 강세와 다른 우주주의 하락을 전했고 Rocket Lab 약세 기사도 확인됐다. 경쟁 구도와 섹터 자금 이동이 부담이다."], ["Resolve AI", "중립~긍정", "$2.68\u003cbr\u003e+$0.15 (+5.93%)", "", "", "주가 +6.77%", "yfinance 뉴스는 3억달러 자사주 매입 계획, Microsoft 출신 인사 영입, 2026년 매출 가이던스를 다뤘다. 가격은 우호적이나 뉴스별 시점 차이는 유의해야 한다."], ["Intuitive Machines", "중립~부정", "$26.62\u003cbr\u003e-$4.02 (-13.12%)", "", "", "주가 -20.84%", "Barron's·yfinance 뉴스는 SpaceX 상장과 우주주 전반의 급락, Intuitive Machines 약세를 전했다. 포트폴리오 내 가장 큰 단기 하락과 7일 약세가 겹쳤다."]]}, {"type": "heading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "**하나금융지주**는 산업단지 생산적 금융 확산 협약과 중소 제조업을 포함한 포용금융 논의가 뉴스의 중심이다. 당일 기관 285억원, 외국인 12억원 순매수와 7거래일 외국인 127억원 순매수가 가격 상승을 함께 확인했다. 다만 해당 뉴스는 정책·사업 방향에 관한 내용이어서 실적 기여 규모는 수집 자료만으로 판단할 수 없다.", "autoBold": true}, {"type": "paragraph", "text": "**우리금융지주**는 주식소각 정정과 자기주식취득 신탁 해지 결과가 **주주환원**, IR 공시가 **기업가치 소통**의 확인 사안이다. 기관 순매수는 상승과 같은 방향이지만 외국인은 당일 76억원, 7일 507억원 순매도했다. 동양생명 주식교환비율 관련 추가 주주 소통과 금융 공공성 관련 현장조사 뉴스가 있어, 공시의 우호적 신호와 규제·지배구조 이슈가 충돌한다.", "autoBold": true}, {"type": "paragraph", "text": "**DB손해보험**은 자동차보험 할인 특약과 반려동물 보험 확대 뉴스가 상품 경쟁 축을 보여준다. 외국인 43억원 순매수와 가격 상승은 같은 방향이지만 7일 외인 누계는 316억원 순매도다. 증권발행실적보고서와 투자설명서는 자본조달 관련 확인 사안이며, 단기 상승만으로 부담이 해소됐다고 보기 어렵다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW 최근 종가**는 1,517.89원으로 직전 거래일 대비 -0.47%였다. **현대차2우B**는 +2.34% 상승하고 외국인이 24억원 순매수했지만, 기관은 96억원 순매도했고 7거래일 외국인 누계도 477억원 순매도다. 원화 강세 방향과 중기 외국인 매도는 수출주에 일관된 우호 신호가 아니다.", "autoBold": true}, {"type": "paragraph", "text": "Naver Search는 현대차그룹의 로봇·피지컬 AI 밸류체인 ETF 등장과 개인의 현대차 순매수를 전했다. 완성차 밖 성장 서사는 확인되지만 우선주 가치에 대한 직접 영향은 **확인 필요**다. DART의 특수관계인 유가증권 매수와 출자는 그룹 내 자본거래·지배구조 축으로 분류해야 하며, 실적 개선 근거로 확대 해석할 수 없다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "**필라델피아반도체지수**는 +1.52%, **Nvidia**는 +0.16%, **삼성전자**는 +7.86%였다. 삼성전자의 기관 1.10조원과 외국인 9,628억원 순매수는 당일 급등을 강하게 확인한다. 반면 7거래일 외국인 누계는 6.67조원 순매도이고, Naver Search는 글로벌 투자은행이 급등한 한국 AI 반도체 종목에 대한 헤지펀드 레버리지 투자를 제한했다고 전했다. 당일 반등과 과열·포지션 리스크를 함께 봐야 한다.", "autoBold": true}, {"type": "paragraph", "text": "**이수페타시스**는 북미 클라우드 업체의 AI 서버 물량 확대 기대와 공모펀드 편입 뉴스가 있었지만, 기관 85억원과 외국인 431억원이 모두 순매도했다. 7일 외인 누계도 1,213억원 순매도라 가격 약세를 수급이 확인한다. Nvidia와 필라델피아반도체지수의 상대적 강세가 국내 AI 기판주로 확산되지 않은 점이 관찰 포인트다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "**SpaceX 상장**이 미국 포트폴리오의 가장 직접적인 변수다. CNBC Markets는 SpaceX가 나스닥 거래를 시작한 뒤 주가가 19% 상승하고 시가총액이 2조달러를 넘었다고 전했다. 반면 yfinance 뉴스는 SpaceX 강세와 다른 우주주의 하락을 함께 다뤘고, **Rocket Lab**과 **Intuitive Machines**는 두 자릿수 하락했다. 섹터 관심 확대보다 상장 종목으로의 자금 집중과 경쟁 부담이 당일 가격에 더 강하게 반영됐다.", "autoBold": true}, {"type": "paragraph", "text": "**Coupang**은 개인정보 침해 관련 6,246.8억원 과징금이 핵심이다. yfinance 뉴스에는 과징금 자체와 예상보다 완화됐다는 평가가 모두 포함됐으며, 전날 급등 뒤 -2.49% 하락했다. **Resolve AI**는 3억달러 자사주 매입 계획과 Microsoft 출신 인사 영입 뉴스 속 상승했지만, 일부 매출 가이던스 기사는 6월 2일 자료라 당일 가격과의 직접성은 낮다.", "autoBold": true}, {"type": "paragraph", "text": "**SCHD**는 배당 전략 분석 기사 중심이고 **Apple** 뉴스는 직접 관련성이 낮아 확인 가능한 가격 신호만 보는 편이 적절하다. **Nvidia**는 AI 투자 열기 뉴스에도 당일 보합권, 7일 약세다. 미국 종목은 국내 투자자별 수급 데이터가 없으므로 뉴스와 종가만으로 영향도를 판단했다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "list", "items": ["**DART:** 우리금융지주 주식소각 정정·자기주식취득 신탁계약 해지, 하나금융지주 IR·주요주주 증권 소유, 삼성전자 최대주주·임원 지분 변동, DB손해보험 증권발행실적·투자설명서, 현대차 특수관계인 자본거래가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["**Naver Search:** 삼성전자 AI 반도체 과열 경고, 우리금융 금융 공공성 조사, 하나금융 생산적 금융 협약, 금호석유화학 R\u0026D 대응이 주요 이슈다."], "autoBold": false}, {"type": "list", "items": ["**yfinance 뉴스:** Coupang 과징금, Rocket Lab 약세, Resolve AI 자사주 매입 계획, Intuitive Machines 급락이 포함됐다."], "autoBold": false}, {"type": "list", "items": ["**CNBC Markets:** SpaceX 상장 후 기업가치 2조달러 돌파와 이란 합의 가능성을 전했다."], "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **삼성전자:**
