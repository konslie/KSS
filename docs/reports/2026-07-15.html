 "text": "**하나금융지주**는 134,000원으로 +1.06% 상승했고, 기관은 289.3억 원 순매수였지만 외국인은 113.1억 원 순매도였다. DART의 **주식소각결정 정정**과 **자기주식취득결과보고서**는 주주환원 관련 확인 사항으로 분류된다. naver_search_news의 은행주 기사에서는 KB·신한·하나의 신고가 흐름과 우리금융의 상대적 소외가 함께 언급돼, 가격 방향은 하나금융에 우호적이지만 외국인 수급은 아직 확인이 필요하다.", "autoBold": true}, {"type": "paragraph", "text": "**우리금융지주**는 -1.60%로 약세였고 외국인 순매도 123.8억 원이 확인됐다. 기관은 148.0억 원 순매수였으므로 수급은 엇갈렸지만, 가격은 외국인 매도 쪽을 더 반영했다. **DB손해보험**은 +1.19% 상승했고 기관 174.9억 원 순매수, 외국인 145.1억 원 순매도가 동시에 나타났다. 보험 뉴스는 배타적사용권과 상품 효율성 중심 재편을 다뤘고, DART 공시는 계열금융회사 약관에 의한 금융거래로 분류된다.", "autoBold": true}, {"type": "paragraph", "text": "**SCHD**는 $32.20으로 -1.11%였고 국내 수급 지표는 적용되지 않는다. yfinance_news에는 배당 ETF 성과와 AI발 인플레이션 관련 ETF 뉴스가 함께 포함돼, 배당형 ETF의 방어적 성격과 물가 민감도가 동시에 관찰 포인트다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW**는 1,488.40원으로 직전 거래일 대비 -0.67%였고 7거래일 흐름도 하락이다. 환율 자체는 수입 비용 부담을 낮추는 방향의 신호지만, **현대차2우B**는 199,800원으로 -0.10%였고 외국인 13.6억 원, 기관 18.4억 원 순매도가 함께 확인됐다.", "autoBold": true}, {"type": "paragraph", "text": "뉴스 측면에서는 naver_search_news에 **중국 전기차 업체의 국내 진입 확대**와 **수입차 점유율 첫 25% 돌파**가 포함됐다. 이는 국내 전기차·수입차 경쟁 구도에 대한 부담 신호다. DART의 **생산중단**, **특수관계인으로부터 기타유가증권매수**, **IR 개최**는 각각 생산 운영, 지배구조·거래, 투자자 커뮤니케이션 축의 확인 사항으로 분류된다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "반도체는 지수와 개별 종목 신호가 한 방향으로만 움직이지 않았다. **필라델피아반도체지수**는 12,661.93으로 +2.54%, **Nvidia**는 $211.80으로 +4.06%였다. yfinance_news에는 AI 데이터센터 규제, 오픈소스 AI 채택, AI 주식 흐름이 포함돼 AI 수요와 규제 변수가 동시에 나타났다.", "autoBold": true}, {"type": "paragraph", "text": "국내에서는 **삼성전자**가 +3.34% 상승했고 기관이 1조 3,783.5억 원 순매수했지만 외국인은 3,001.8억 원 순매도였다. DART에는 자기주식처분결정, 자기주식처분결과보고서, 임원·주요주주 보고가 다수 확인됐다. **이수페타시스**는 -1.71%였고 기관은 328.2억 원 순매수, 외국인은 352.9억 원 순매도였다. 반도체 대형주 기관 매수 뉴스와 외국인 매도 종목 포함 뉴스가 같이 존재해, AI 기대와 외국인 수급은 엇갈린 상태다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "미국 종목은 국내 기관·외국인 //www.ceoscoredaily.com/page/view/2026071014014519571)"], "autoBold": false}, {"type": "list", "items": ["금호석유화학: [석화업계 하반기 실적 희비와 첨단소재 돌파구](https://www.m-i.kr/news/articleView.html?idxno=1391437)"], "autoBold": false}, {"type": "list", "items": ["이수페타시스: [거래소 기관의 반도체 대형주 매수](https://www.pinpointnews.co.kr/news/articleView.html?idxno=468371), [거래소 외국인의 반도체 대장주 매수와 일부 종목 매도](https://www.pinpointnews.co.kr/news/articleView.html?idxno=468370)"], "autoBold": false}, {"type": "list", "items": ["**미국 뉴스**"], "autoBold": false}, {"type": "list", "items": ["CNBC Markets: [Goldman Sachs와 JPMorgan Chase가 AI 수혜주로 부상](https://www.cnbc.com/2026/07/14/goldman-sachs-and-jpmorgan-chase-are-emerging-as-ai-winners.html), [2026년 6월 CPI 세부 내역](https://www.cnbc.com/2026/07/14/inflation-cpi-june-2026-in-one-chart.html), [호르무즈 해협 봉쇄 재개 전 미국의 이란 공습](https://www.cnbc.com/2026/07/14/iran-strikes-hormuz-strait-blockade-trump-tolls.html)"], "autoBold": false}, {"type": "list", "items": ["Apple: [AI 기기의 중요성](https://finance.yahoo.com/technology/article/apples-lawsuit-shows-the-importance-of-ai-devices-for-the-iphone-makers-future-analyst-121457529.html), [OpenAI의 Apple 영업비밀 소송 반박](https://finance.yahoo.com/technology/ai/articles/openai-pushes-back-apple-trade-220742428.html)"], "autoBold": false}, {"type": "list", "items": ["Coupang: [한국 법원의 김범석 창업자 동일인 지정 관련 처분 정지](https://finance.yahoo.com/markets/stocks/articles/south-korean-court-suspends-ftc-054535691.html)"], "autoBold": false}, {"type": "list", "items": ["우주주: [Rocket Lab 관련 우주주 조정](https://finance.yahoo.com/markets/stocks/articles/space-stock-pulls-back-historically-192059950.html), [Rocket Lab과 Intuitive Machines 비교](https://www.fool.com/investing/2026/07/14/space-stock-down-which-better-buy-rklb-lunr/), [Intuitive Machines의 달 탐사 운영 강화](https://finance.yahoo.com/markets/stocks/articles/intuitive-machines-strengthening-lunar-mission-144000230.html)"], "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **시장 위험도는 중립**이지만 KOSPI와 Nasdaq의 7거래일 추세가 약해, 단기 반등과 중기 흐름을 분리해서 봐야 한다.", "autoBold": false}, {"type": "paragraph", "text": "2. **반도체**는 SOX·Nvidia·삼성전자 가격은 강했지만, 삼성전자와 이수페타시스의 외국인 순매도가 부담으로 남았다.", "autoBold": false}, {"type": "paragraph", "text": "3. **금융주**는 하나금융지주와 DB손해보험에서 기관 순매수가 확인됐고, 외국인 순매도와 주주환원·보험 상품 뉴스의 지속성이 관찰 대상이다.", "autoBold": false}, {"type": "paragraph", "text": "4. **현대차2우B**는 원/달러 하락보다 중국 전기차의 국내 진입과 외국인·기관 동반 매도가 더 직접적인 단기 부담으로 보인다.", "autoBold": false}, {"type": "paragraph", "text": "5. **미국 성장주**는 AI와 우주 뉴스가 많지만 종목별 가격 흐름이 엇갈려, 뉴스 강도보다 가격 확인이 필요하다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["`view_model.json` 기준 뉴스 48건, 공시 15건, 보유종목 15개가 수집됐고 7거래일 수급 합계는 사용 가능하다."], "autoBold": false}, {"type": "list", "items": ["`krx_open_api`와 `krx_investor_flows`는 `KRX_AUTH_KEY not set`으로 건너뛰었다. 국내 가격·수급은 `naver_finance`, `pykrx_fallback`, DART, naver_search_news, yfinance_news 기반으로 작성했다."], "autoBold": false}, {"type": "list", "items": ["시장 지표와 보유종목 가격의 기준일은 대부분 **2026-07-14 직전 거래일 종가**다. 2026-07-15 장중 가격이나 체결 흐름은 이 보고서에 포함되지 않았다."], "autoBold": false}, {"type": "list", "items": ["미국 종목은 국내 기관·외국인 수급이 적용되지 않으며, 공시는 수집 대상에 포함되지 않았다."], "autoBold": false}, {"type": "list", "items": ["일부 뉴스는 검색어 매핑상 종목 직접 관련성이 낮다. 현대바이오의 화장품 브랜드평판 기사, 우리금융지주의 회계법인 실적 기사, 금호석유화학의 사회공헌성 기사 등은 투자 판단 근거로 낮은 가중치로만 반영했다."], "autoBold": false}]}, "view_model": {"schema": "kss-view-model.v1", "date": "2026-07-15", "as_of": "2026-07-15T07:31:47.714862+09:00", "timezone": "Asia/Seoul", "market_status": {"label": "중립", "score": 0, "reasons": [], "reason": ""}, "market_indicators": [{"name": "KOSPI", "symbol": "^KS11", "source": "pykrx_fallback", "as_of_date": "2026-07-14", "display_order": 0, "unit": "index", "risk_tags": [], "short_comment": "보합권", "price": {"latest_close": 6856.83, "previous_close": 6806.9302, "close_7d_ago": 8051.3301, "recent_closes": [8051.3301, 7656.3101, 7246.79, 7291.9102, 7475.
