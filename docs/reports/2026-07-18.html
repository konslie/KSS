", "-20.0%", "yfinance_news에 달 탐사 운영 강화와 우주주 비교 뉴스가 수집됐고, 7거래일 흐름은 약세다."]]}, {"type": "heading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "**하나금융지주**, **우리금융지주**, **DB손해보험**, **SCHD**는 가격 방향보다 뉴스와 수급의 결이 갈렸다. 하나금융지주는 은행주가 코스피 급락 구간에서 상대 강세였다는 naver_search_news 기사와 금융지주 어닝 시즌 뉴스가 수집됐지만, 당일 외국인은 69.4억 순매도였다. 우리금융지주는 동양생명 편입 마무리 수순 뉴스와 함께 기관·외국인 동반 순매수가 확인되어 보험 경쟁력 강화 이슈가 가격 흐름을 완전히 부정하지는 않았다.", "autoBold": true}, {"type": "paragraph", "text": "DB손해보험은 가격과 기관 수급은 양호했지만 외국인 순매도 129.0억이 부담이었다. 수집 뉴스 중 스포츠 소송 기사는 기업가치 관련 직접성이 낮아 영향도 판단에서 낮게 두고, dart의 계열금융회사 금융거래 공시를 확인 사항으로 둔다. SCHD는 52주 신고가 뉴스가 수집됐으나 당일 가격은 -0.39%였고, 국내 수급 데이터가 없어 배당 ETF 관련 뉴스와 가격만 분리해서 본다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**현대차2우B**는 직전 거래일 종가 기준 198,000원으로 -0.55%였고, 외국인 81.4억 순매수와 기관 22.5억 순매도가 엇갈렸다. USD/KRW는 1,487.46원으로 직전 거래일 대비 +0.08%였으나 7거래일 전 1,503.35원보다 낮아 단기 환율 부담은 급격히 커진 상태로 수집되지는 않았다.", "autoBold": true}, {"type": "paragraph", "text": "뉴스는 현대차 '아틀라스 쇼크'와 중국차 가격 경쟁 이슈가 수집됐고, dart에는 **기업설명회(IR)개최**와 **생산중단** 공시가 확인됐다. 가격 약세에도 외국인 순매수가 붙어 있어, 자동차 우선주의 관찰축은 환율 숫자 자체보다 생산중단 공시의 범위와 가격 경쟁 뉴스의 직접성을 확인하는 쪽이다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "**반도체**는 이번 보고서에서 가장 약한 축이다. 필라델피아반도체지수는 -1.63%, Nvidia는 -2.21%, 삼성전자는 -8.77%, 이수페타시스는 -9.89%로 수집됐고, 삼성전자와 이수페타시스 모두 외국인 순매도가 가격 약세와 같은 방향이었다. 삼성전자는 기관 순매도 11,683.4억, 외국인 순매도 2,139.6억으로 수급 부담이 컸다.", "autoBold": true}, {"type": "paragraph", "text": "뉴스는 삼성전자에 AI 생태계와 2분기 실적 확인 이슈가 수집됐고, 이수페타시스에는 외국인 주간 순매매와 반도체 개인 선호 뉴스가 붙었다. 다만 삼성전자 dart 공시 대부분은 자기주식처분 결과와 임원·주요주주 특정증권 소유상황 보고서로, 사업 실적 자체를 확정하는 내용으로 확대 해석하지 않는다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "미국 보유 종목은 국내 수급이 없으므로 가격과 뉴스만 따로 본다. **Apple**은 +0.14%였고, yfinance_news에는 Nvidia 하락 속 세계 최대 가치 기업 지위 회복 뉴스가 수집됐다. 반대로 **Nvidia**는 -2.21%였고, 반도체 손실 축소 및 성장 기술주 비교 뉴스가 수집되어 AI 리더십 기대와 단기 가격 부담이 함께 존재한다.", "autoBold": true}, {"type": "paragraph", "text": "**Coupang**은 -1.42%, 7거래일 기준 -13.3%로 약했고, 김범석 지배력 판결 관련 법원 정지와 실적 전 밸류에이션 논쟁 뉴스가 수집됐다. **Rocket Lab**과 **Intuitive Machines**는 당일 소폭 상승했지만 7거래일 흐름은 각각 -18.1%, -20.0%였다. **Resolve AI**는 -2.53%였고, 블록체인 데이터 구조 수요 관련 뉴스가 수집됐으나 최근 가격 흐름은 약세로 표시된다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "list", "items": ["시장 뉴스: CNBC Markets에서 [경제 전망 악화와 Trump 책임 여론조사](https://www.cnbc.com/2026/07/17/economic-outlook-is-worsening-and-trump-is-getting-blamed-cnbc-survey-finds.html), [중국 AI 오픈웨이트 모델 전환](https://www.cnbc.com/2026/07/17/moonshot-ai-kimi-k3-model-openai-anthropic-china.html), [Hormuz 유조선 리스크](https://www.cnbc.com/2026/07/17/iran-war-oil-tanker-strait-hormuz-traffic-attacks-trump.html), [Boeing 737 Max·787 인증 권한](https://www.cnbc.com/2026/07/17/faa-boeing-737-max-787.html) 뉴스가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["국내 포트폴리오 뉴스: 현대차2우B는 [현대차 '아틀라스 쇼크'](https://www.bntnews.co.kr/article/view/bnt202607180030), 하나금융지주는 [은행주 상대 강도](https://www.news1.kr/finance/general-stock/6231027)와 [금융지주 어닝 시즌](https://www.etoday.co.kr/news/view/2604525), 우리금융지주는 [동양생명 편입 마무리](https://www.bloter.net/news/articleView.html?idxno=668297), 삼성전자는 [AI 생태계와 2분기 실적](https://www.techm.kr/news/articleView.html?idxno=153476), 금호석유화학은 [공급과잉 대응 R\u0026D](https://www.thebell.co.kr/free/content/ArticleView.asp?key=202607161620406920102718)가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["미국 포트폴리오 뉴스: SCHD는 [52주 신고가](https://finance.yahoo.com/markets/stocks/articles/dividend-etf-schd-hits-52-153500708.html), Apple은 [세계 최대 가치 기업 지위 회복](https://finance.yahoo.com/video/apple-reclaims-worlds-most-valuable-company-as-nvidia-slips-151104675.html), Coupang은 [김범석 지배력 판결 관련 법원 정지](https://finance.yahoo.com/markets/stocks/articles/coupang-cpng-wins-court-pause-170829134.html), Rocket Lab은 [Piper Sandler 중립 커버리지 개시](https://finance.yahoo.com/markets/stocks/articles/rocket-lab
