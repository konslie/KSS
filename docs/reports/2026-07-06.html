 은행주는 가격 방향보다 외국인 매도 지속 여부와 외환시장 제도 변화가 금융주 거래대금·환율 민감도에 실제로 연결되는지를 확인해야 한다.", "autoBold": true}, {"type": "paragraph", "text": "**DB손해보험**은 가격이 147,200원으로 소폭 상승했지만 외국인은 32억 원 순매도였다. 수집 뉴스 중 펫보험 시장 1,000억 원 돌파와 손보업계 경쟁은 사업 이슈로 볼 수 있으나, 부동산금융 기사는 메리츠화재 중심이고 골프 포토 기사는 투자 관련성이 낮다. DART의 자본인정 채무증권 발행 결정 정정 공시는 자본 구조 확인 항목으로 분류하는 편이 적절하다. **SCHD**는 미국 ETF라 국내 수급은 없고, yfinance_news의 수수료·장기 성과 격차와 배당 구성 이슈가 관찰 포인트다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**현대차2우B**는 218,500원으로 +2.10% 상승했고, 최신 종목 수급에서 외국인은 25억 원 순매수, 기관은 38억 원 순매도였다. **USD/KRW**는 1,532.48원으로 직전 거래일 대비 -0.63% 하락해 원화 강세 방향의 신호가 수집됐다. 외환시장 24시간 개장 뉴스는 금융시장 구조 변화 이슈이며, 자동차 우선주에는 환율보다 종목 수급과 현대차 자체 공시 확인이 더 직접적인 근거다.", "autoBold": true}, {"type": "paragraph", "text": "DART에는 현대차의 **풍문또는보도에대한해명(미확정)**, **영업(잠정)실적(공정공시)**, **지속가능경영보고서등관련사항**이 수집됐다. 월드컵 무대의 아틀라스 로보틱스 노출 뉴스는 로보틱스 기술력 홍보 성격이 강하지만, 입력 설명에는 현대차가 휴머노이드 로봇 아틀라스의 퍼포먼스를 선보였다는 내용이 있어 미래 기술 노출 항목으로만 제한해서 본다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "반도체는 방향이 엇갈린다. **삼성전자**는 317,000원으로 +2.42% 상승했고 기관은 1조 3,063억 원 순매수였지만, 외국인은 3,948억 원 순매도였고 7거래일 기준 가격은 -6.63%다. DART에는 임원·주요주주 보고와 장래사업·경영계획 공시가 있었고, Naver 뉴스에는 실적 D-1 및 코스피 회복 보도가 수집됐다.", "autoBold": true}, {"type": "paragraph", "text": "반대로 **이수페타시스**는 106,300원으로 -3.45% 하락했고 외국인 589억 원 순매도가 가격 약세와 같은 방향이다. **Nvidia**도 yfinance 기준 194.83달러로 -1.39%였고, 수집된 AI 관련 뉴스는 Palantir·Anthropic 중심이라 Nvidia 자체 실적이나 수주 근거로 확장하기 어렵다. **필라델피아반도체지수**의 -5.44% 급락은 AI·반도체 기대가 전반 지수에는 부담으로 반영됐다는 신호지만, 국내 삼성전자 당일 반등과는 별도로 봐야 한다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "미국 종목 가격은 yfinance 기준으로 대부분 **2026-07-02** 종가가 최신이다. **Apple**은 308.63달러로 +4.84%였고, 수집 뉴스는 AI 버블 우려, 기술주 선물, 빅테크 전력 확보 부담을 함께 제시한다. **Coupang**은 18.56달러로 +2.37%였고, yfinance_news에는 주가 움직임과 밸류에이션 관련 직접 기사가 수집됐다. **SCHD**는 32.39달러로 +1.70%였지만, 기사 초점은 수수료 대비 장기 성과 격차와 배당 구성이다.", "autoBold": true}, {"type": "paragraph", "text": "고변동 성장주는 혼재했다. **Rocket Lab**은 100.46달러로 소폭 상승했고 VICTUS HAZE 발사 및 U.S. Space Force 관련 뉴스가 직접 수집됐다. **Resolve AI**는 2.84달러로 -7.79%, **Intuitive Machines**는 19.58달러로 -3.07%였으며, 두 종목 모두 뉴스는 사업 모멘텀을 언급하지만 가격은 약세였다. 미국 종목에는 국내 투자자 수급 데이터가 없으므로, 뉴스 제목이 말하는 사업 이슈와 종가 방향을 분리해서 해석한다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "paragraph", "text": "**공시**", "autoBold": false}, {"type": "list", "items": ["현대차2우B: DART [풍문또는보도에대한해명(미확정)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260703801045), [영업(잠정)실적(공정공시)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260701800788), [지속가능경영보고서등관련사항](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260630800715)."], "autoBold": false}, {"type": "list", "items": ["하나금융지주: DART [기업설명회(IR)개최](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260702800880), [지속가능경영보고서등관련사항](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260630800995), [임원ㆍ주요주주특정증권등소유상황보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260630000765)."], "autoBold": false}, {"type": "list", "items": ["삼성전자: DART 임원ㆍ주요주주특정증권등소유상황보고서 4건과 [장래사업ㆍ경영계획 공정공시](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260629801143), [정정 공시](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260629801230)."], "autoBold": false}, {"type": "list", "items": ["DB손해보험: DART [[기재정정]주요사항보고서(자본으로인정되는채무증권발행결정)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260629000009)."], "autoBold": false}, {"type": "list", "items": ["현대바이오: DART [주식등의대량보유상황보고서(일반)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260630001013)."], "autoBold": false}, {"type": "paragraph", "text": "**뉴스**", "autoBold": false}, {"type": "list", "items": ["Naver 뉴스에는 [원·달러 시장, 24시간 열린다](https://news.mtn.co.kr/news-detail/2026070609060569420), ['원화 글로벌 도약 출발점'...원화 외환시장 24시간 개장](https://www.financialpost.co.kr/news/articleView.html?idxno=265157), [외환시장 24시간 시대 개막](http://www.issuenbiz.com/news/articleView.html?idxno=77669)이 수집됐다."], "autoBold": fal ragraph", "text": "4. **미국 종가 시차**: 미국 종목과 Nasdaq, S\u0026P 500, VIX, SOX는 2026-07-02 기준 종가가 최신으로 수집돼 한국 장중 판단에는 시차가 있다.", "autoBold": false}, {"type": "paragraph", "text": "5. **뉴스 직접성**: 브랜드평판, 스포츠·행사성 기사, 목표가성 기사 등은 직접 투자 근거로 쓰기 어렵고 가격·수급·공시와 연결되는 항목만 우선한다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["입력 커버리지: 뉴스 51건, 공시 14건, 보유종목 15개가 수집됐고, 7거래일 수급 집계는 사용 가능하다."], "autoBold": false}, {"type": "list", "items": ["`yfinance_indicators`의 VIX 데이터는 일부 유효하지 않은 종가 행이 제외된 **partial** 상태다."], "autoBold": false}, {"type": "list", "items": ["`krx_open_api`와 `krx_investor_flows`는 `KRX_AUTH_KEY`가 없어 **skipped** 상태였다."], "autoBold": false}, {"type": "list", "items": ["국내 종목별 가격은 naver_finance와 pykrx_fallback 기준으로 수집됐고, 최신 종목 수급의 기준일은 20260703으로 표시된다."], "autoBold": false}, {"type": "list", "items": ["미국 종목과 미국 지수 일부는 2026-07-02 종가가 최신으로 수집됐으므로, 2026-07-06 한국 시간의 현재 가격으로 해석하면 안 된다."], "autoBold": false}]}, "view_model": {"schema": "kss-view-model.v1", "date": "2026-07-06", "as_of": "2026-07-06T09:31:33.036197+09:00", "timezone": "Asia/Seoul", "market_status": {"label": "중립", "score": 0, "reasons": [], "reason": ""}, "market_indicators": [{"name": "KOSPI", "symbol": "^KS11", "source": "yfinance", "as_of_date": "2026-07-06", "display_order": 0, "unit": "index", "risk_tags": [], "short_comment": "상승", "price": {"latest_close": 8244.8701, "previous_close": 8088.3398, "close_7d_ago": 8411.21, "recent_closes": [8411.21, 8394.6504, 8476.4805, 8303.4102, 7648.0898, 8088.3398, 8244.8701], "recent_dates": ["2026-06-26", "2026-06-29", "2026-06-30", "2026-07-01", "2026-07-02", "2026-07-03", "2026-07-06"], "change": 156.5303, "change_pct": 1.94, "trend": "up"}, "volume": 43795}, {"name": "KOSDAQ", "symbol": "^KQ11", "source": "yfinance", "as_of_date": "2026-07-06", "display_order": 1, "unit": "index", "risk_tags": [], "short_comment": "보합권", "price": {"latest_close": 868.41, "previous_close": 868.41, "close_7d_ago": 851.37, "recent_
