국인 순매수가 같은 방향이었다. 하나금융은 naver_search_news의 [청라 시대 연 하나금융...AI 금융 허브 구축](https://www.news2day.co.kr/article/20260710500189) 기사처럼 조직 이전과 AI 금융 허브 구축이 전략 이슈로 잡혔고, 우리금융은 [4대 금융 주가 견조, 우리금융만 정체](https://www.investchosun.com/site/data/html_dir/2026/07/10/2026071080081.html) 기사처럼 상대적 경쟁력 점검 이슈가 남아 있다. 가격과 당일 수급만 보면 두 종목 모두 우호적이지만, 우리금융은 기사 제목상 비은행 경쟁력 확인이 필요하다.", "autoBold": true}, {"type": "paragraph", "text": "**DB손해보험**은 가격 상승 폭이 컸고 기관도 순매수였지만 외국인은 순매도였다. naver_search_news의 [차량 침수 선제 대응](http://www.fins.co.kr/news/articleView.html?idxno=109098), [펫보험 플랫폼 관련 부수업무 승인](https://it.chosun.com/news/articleView.html?idxno=2023092165594) 이슈는 손해율 관리와 신사업 접점에 관한 재료로 볼 수 있으나, 외국인 수급이 같은 방향으로 확인되지는 않았다. **SCHD**는 yfinance_news 기준 배당 ETF 관련 기사와 Schwab ETF 자금 유입 기사가 있었고, 국내 수급 지표가 없어 가격과 뉴스만 확인 가능하다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW**는 yfinance 기준 2026-07-12 종가 1,498.77원으로 직전 거래일 대비 -0.47%였고, 7개 관측치 흐름도 하락 방향이었다. 원/달러가 내려온 점은 수출주 환산 이익 측면에서는 강한 우호 신호로 단정하기 어렵지만, 시장 위험도 측면에서는 환율 급등 부담이 줄어든 것으로 해석할 수 있다.", "autoBold": true}, {"type": "paragraph", "text": "**현대차2우B**는 2026-07-10 기준 204,000원으로 상승했지만, 기관과 외국인은 각각 순매도였다. naver_search_news의 [현대차 노조 부분파업 기사](https://biz.sbs.co.kr/article_hub/20000322029?division=NAVER)는 생산 차질 우려를, [보스턴다이내믹스 나스닥 상장 관련 기사](https://news.bizwatch.co.kr/article/market/2026/07/08/0036)는 그룹 구조 및 자회사 가치 확인 이슈를 제공한다. DART의 [특수관계인으로부터기타유가증권매수](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710000577)와 [기업설명회(IR)개최](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710800714)는 각각 지배구조/거래 확인과 투자자 커뮤니케이션 축으로 분류된다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "**필라델피아반도체지수**는 2026-07-10 기준 +0.06%로 보합권이었지만, **삼성전자**와 **Nvidia**는 각각 +2.52%, +4.03%로 가격이 더 강했다. 삼성전자는 naver_search_news의 [반도체 투심 개선 신호](https://biz.sbs.co.kr/article_hub/20000322021?division=NAVER) 기사와 함께 DART에 [자기주식처분결과보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710000585), [잠정실적 공시](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260707800004), [IR 개최](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260707800015)가 들어왔다. 당일 외국인과 기관 수급도 모두 순매수였다.", "autoBold": true}, {"type": "paragraph", "text": "**이수페타시스**는 [AI 서버 기판 수요와 실적 기대](https://www.pinpointnews.co.kr/news/articleView.html?idxno=467712) 뉴스가 직접적인 긍정 재료로 보이지만, 당일 외국인은 순매도였다. **Nvidia**는 yfinance_news의 [AI 주식 비교 기사](https://www.fool.com/investing/2026/07/12/best-artificial-intelligence-ai-stock-amd-nvidia-o/)와 [Nvidia, Micron, Sandisk 관련 시장 기사](https://www.investors.com/market-trend/stock-market-today/dow-jones-futures-us-iran-attacks-nvidia-micron-sandisk-taiwan-semiconductor/?src=A00220\u0026yptr=yahoo)가 잡혔다. AI 기대는 이어졌지만, 국내 소부장 쪽은 외국인 매도가 남아 있어 삼성전자와 이수페타시스의 수급 질은 다르게 봐야 한다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "미국 포트폴리오는 최근 종가가 모두 yfinance에서 수집됐지만, 국내식 기관/외국인 수급은 제공되지 않는다. **SCHD**는 배당 ETF 비교와 Schwab ETF 자금 유입 기사, **Apple**은 OpenAI 관련 소송 및 전직 엔지니어 이슈, **Nvidia**는 AI 종목 비교와 반도체 시장 기사로 뉴스 재료가 확인됐다. Apple은 직전 거래일 대비 약보합이지만 7개 관측치 기준으로는 상승권이고, Nvidia는 당일과 7개 관측치 모두 강했다.", "autoBold": true}, {"type": "paragraph", "text": "성장주와 우주 관련 종목은 가격 신호가 더 약하다. **Coupang**은 시장 상승 속 주가 하락 기사와 Q1 이후 평가 기사가 잡혔고, **Rocket Lab**은 신기술 공개 기사에도 주가 약세 기사가 함께 있었다. **Resolve AI**와 **Intuitive Machines**는 AI/우주경제 기사 제목은 확인되지만, 각각 7개 관측치 기준 -15.58%, -20.10%라 가격 확인 없이는 긍정 재료만으로 영향도를 높이기 어렵다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "list", "items": ["DART: 현대차2우B에는 [특수관계인으로부터기타유가증권매수](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710000577), [기업설명회(IR)개최](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710800714)가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["DART: 삼성전자에는 [임원ㆍ주요주주특정증권등소유상황보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710000718), [주식등의대량보유상황보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710000678), [자기주식처분결과보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710000585), [주요사항보고서(자기주식처분결정)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260707000403), [IR 개최](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260707800015), [잠정실적 공시](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260707800004), [최대주주등소유주식변동신고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260706800672)가 포함됐다."], "autoBold": false}, {"type": "list", "items": ["naver_search_news: 현대차는 [부분파업](https://biz.sbs.co.kr/article_hub/20000322029?division=NAVER)과 [보스턴다이내믹스 상장 구조](https://news.bizwatch.co.kr/article/market/2026/07/08/0036), 하나금융은 [청라 AI 금융 허브](https://www.news2day.co.kr/article/20260710500189), 우리금융은 [4대 금융 비교](https://www.investchosun.com/site/data/html_dir/2026/07/10/2026071080081.html), 삼성전자는 [반도체 투심 개선 신호](https://biz.sbs.co.kr/article_hub/20000322021?division=NAVER)가 주요 항목이다."], "autoBold": false}, {"type": "list", "items": ["naver_search_news: DB손해보험은 [차량 침수 대응](http://www.fins.co.kr/news/articleView.html?idxno=109098)과 [펫보험 플랫폼](https://it.chosun.com/news/articleView.html?idxno=2023092165594), 금호석유화학은 [석화 업황](http://www.hansbiz.co.kr/news/articleView.html?idxno=849533), [자사주 소각](http://www.fieldnews.kr/news/articleView.html?idxno=29884), [AI 공정 혁신](https://www.etnews.com/20260710000056), 이수페타시스는 [AI 서버 기판 수요](https://www.pinpointnews.co.kr/news/articleView.html?idxno=467712)가 확인됐다."], "autoBold": false}, {"type": "list", "items": ["yfinance_news: SCHD, Apple, Nvidia, Coupang, Rocket Lab, Resolve AI, Intuitive Machines 관련 뉴스가 수집됐다. CNBC Markets의 정치·생활 기사 다수는 포트폴리오 직접 관련성이 낮아 핵심 해석에서 제외했다."], "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **위험도 0점**이지만 국내 지수와 일부 종목의 반등은 2026-07-10 종가 기준이다. 2026-07-13 장중 데이터가 아니라는 점을 분리해서 봐야 한다.", "autoBold": false}, {"type": "paragraph", "text": "2. **금융주**는 하나금융지주와 우리금융지주의 외국인 순매수 지속 여부가 핵심이다. DB손해보험은 기관 매수와 외국인 매도 엇갈림이 관찰 포인트다.", "autoBold": false}, {"type": "paragraph", "text": "3. **반도체**는 삼성전자와 Nvidia 가격은 우호적이나, 이수페타시스는 AI 서버 기판 뉴스에도 외국인 순매도가 컸다.", "autoBold": false}, {"type": "paragraph", "text": "4. **현대차2우B**는 환율 부담 완화보다 노조 부분파업과 그룹 지배구조/상장 이슈의 직접 영향 확인이 우선이다.", "autoBold": false}, {"type": "paragraph", "text": "5. **미국 성장/우주주**는 뉴스 재료가 있어도 Rocket Lab, Resolve AI, Intuitive Machines의 7개 관측치 가격 약세가 먼저 확인된다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["`krx_open_api`와 `krx_investor_flows`는 `KRX_AUTH_KEY not set`으로 skipped 처리됐다."], "autoBold": false}, {"type": "list", "items": ["국내 가격과 종목 수급은 `naver_finance` 및 `pykrx_fallback` 기준이며, 국내 종목 가격 기준일은 2026-07-10이다."], "autoBold": false}, {"type": "list", "items": ["미국 종목 가격은 `yfinance` 기준 2026-07-10 종가이며, 미국 종목에는 기관/외국인 수급 데이터가 없다."], "autoBold": false}, {"type": "list", "items": ["Gold와 USD/KRW는 yfinance 기준 2026-07-12 관측치가 포함돼 주식 종가 기준일과 다르다."], "autoBold": false}, {"type": "list", "items": ["수집 로그에 KRX same-day index/flow 빈 데이터 프레임 메시지가 있었지만, `view_model.json`에는 7거래일 가격과 수급 요약이 생성됐다."], "autoBold": false}]}, "view_model": {"schema": "kss-view-model.v1", "date": "2026-07-13", "as_of": "2026-07-13T07:32:29.632999+09:00", "timezone": "Asia/Seoul", "market_status": {"label": "중립", "score": 0, "reasons": [], "reason": ""}, "market_indicators": [{"name": "KOSPI", "symbol": "^KS11", "source": "yfinance", "as_of_date": "2026-07-10", "display_order": 0, "unit": "index", "risk_tags": ["시장 강세"], "short_comment": "강세", "price": {"latest_close": 7475.9399, "previous_close": 7291.9102, "close_7d_ago": 7648.0898, "recent_closes": [7648.0898, 8088.3398, 8051.3301, 7656.3101, 7246.79, 7291.9102, 7475.9399], "recent_dates": ["2026-07-02", "2026-07-03", "2026-07-06", "2026-07-07", "2026-07-08", "2026-07-09", "2026-07-10"], "change": 184.0298, "change_pct": 2.52, "trend": "up"}, "volume": 453200}, {"name": "KOSDAQ", "symbol": "^KQ11", "source": "yfinance", "as_of_date": "2026-07-10", "display_order": 1, "unit": "index", "risk_tags": ["시장 강세"], "short_comment": "강세", "price": {"late
