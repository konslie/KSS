: true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "**SpaceX 상장**이 미국 포트폴리오의 가장 직접적인 변수다. CNBC Markets는 SpaceX의 역사적 상장과 2조달러 시가총액을 다뤘고, yfinance 뉴스는 상장 당일 다른 우주주의 급락을 전했다. **Rocket Lab**과 **Intuitive Machines**는 두 자릿수 하락했으며, Intuitive Machines에는 NASA 로버 수주 실패 뉴스도 겹쳤다. 섹터 관심 확대보다 경쟁 부담과 상장 종목으로의 자금 집중이 가격에 더 강하게 나타났다.", "autoBold": true}, {"type": "paragraph", "text": "**Coupang**은 개인정보 침해 관련 6,246.8억원 과징금과 글로벌 성장 부담이 핵심이다. **Resolve AI**는 TCS 협력, TraceWare 검증, 3억달러 자사주 매입 계획, Microsoft 출신 인사 영입 뉴스 속 상승했다. **Apple**은 직접 관련 뉴스가 제한된 가운데 당일·7일 약세였고, **SCHD**는 배당 전략 분석 기사 중심이라 가격과 연결할 새 사업 이슈가 부족하다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "list", "items": ["**DART:** 우리금융지주 주식소각 정정·자기주식취득 신탁 해지, 하나금융지주 IR·주요주주 증권 소유, 삼성전자 최대주주·임원 지분 변동, DB손해보험 증권발행실적·투자설명서, 현대차 특수관계인 자본거래가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["**Naver Search:** 현대차 주주친화 강화와 제네시스 유럽 경쟁, 하나금융 생산적 금융 협약, 우리금융을 포함한 금융지주 증권사 자본확충, DB손해보험 보험사기 환수 승소율이 주요 이슈다."], "autoBold": false}, {"type": "list", "items": ["**yfinance 뉴스:** Coupang 과징금, Rocket Lab을 포함한 우주주 약세, Resolve AI 자사주 매입 계획, Intuitive Machines의 NASA 로버 수주 실패가 포함됐다."], "autoBold": false}, {"type": "list", "items": ["**CNBC Markets:** SpaceX의 역사적 상장과 2조달러 시가총액, 이란 합의 시점 관련 소식을 전했다."], "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **우주주:** SpaceX 상장 이후 Rocket Lab·Intuitive Machines의 경쟁 부담과 큰 폭의 가격 변동이 진정되는지 본다.", "autoBold": false}, {"type": "paragraph", "text": "2. **삼성전자:** +7.86% 반등이 7거래일 약세를 줄이는지, 다음 거래일 수급 데이터가 가격을 확인하는지 살핀다.", "autoBold": false}, {"type": "paragraph", "text": "3. **금융주:** 우리금융 주주환원 공시와 금융지주 증권사 자본확충 이슈가 다음 거래일 가격·수급에 어떻게 반영되는지 구분한다.", "autoBold": false}, {"type": "paragraph", "text": "4. **Coupang:** 개인정보 침해 과징금이 글로벌 성장과 규제 비용 평가에 미치는 후속 반응을 확인한다.", "autoBold": false}, {"type": "paragraph", "text": "5. **현대차2우B:** 주주친화·유럽 경쟁 확대 뉴스와 7거래일 가격 약세 사이의 간극이 줄어드는지 본다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["국내·미국 보유주 **15개**와 시장 지표 **8개**의 가격이 모두 채워졌다. 일요일 실행이므로 주식·지표 가격은 **가장 최근 유효 거래일인 2026-06-12 종가**를 사용했다."], "autoBold": false}, {"type": "list", "items": ["뉴스 **47건**과 DART 공시 **13건**이 수집됐다."], "autoBold": false}, {"type": "list", "items": ["선택적 KRX 참조 데이터 일부와 국내 보유주의 기관·외국인 수급은 수집되지 않았다. 따라서 이번 보고서는 수급 방향이나 규모를 추정하지 않았다."], "autoBold": false}, {"type": "list", "items": ["미국 종목은 국내 투자자별 수급 데이터 적용 대상이 아니다."], "autoBold": false}, {"type": "list", "items": ["일부 검색 뉴스는 해당 종목과 직접 관련성이 낮아 **확인 필요**로 표시했다."], "autoBold": false}]}, "view_model": {"schema": "kss-view-model.v1", "date": "2026-06-14", "as_of": "2026-06-14T09:28:59.090213+09:00", "timezone": "Asia/Seoul", "market_status": {"label": "중립", "score": 0, "reasons": [], "reason": ""}, "market_indicators": [{"name": "KOSPI", "symbol": "^KS11", "source": "yfinance", "as_of_date": "2026-06-12", "display_order": 0, "unit": "index", "risk_tags": ["시장 강세"], "short_comment": "강세", "price": {"latest_close": 8123.6201, "previous_close": 7763.9502, "close_7d_ago": 8639.4102, "recent_closes": [8639.4102, 8160.5898, 7484.4102, 8096.9302, 7730.8198, 7763.9502, 8123.6201], "recent_dates": ["2026-06-04", "2026-06-05", "2026-06-08", "2026-06-09", "2026-06-10", "2026-06-11", "2026-06-12"], "change": 359.6699, "change_pct": 4.63, "trend": "up"}, "volume": 493400}, {"name": "KOSDAQ", "symbol": "^KQ11", "source": "yfinance", "as_of_date": "2026-06-12", "display_order": 1, "unit": "index", "risk_tags": ["시장 강세"], "short_comment": "강세", "price": {"latest_close": 1029.05, "previous_close": 996.93, "close_7d_ago": 1049.73, "recent_closes": [1049.73, 1002.44, 911.39, 967.81, 951.63, 996.93, 1029.05], "recent_dates": ["2026-06-04", "2026-06-05", "2026-06-08", "2026-06-09", "2026-06-10", "2026-06-11", "2026-06-12"], "change": 32.1201, "change_pct": 3.22, "trend": "up"}, "volume": 644900}, {"name": "Nasdaq", "symbol": "^IXIC", "source": "
