4.65달러\u003cbr\u003e-2.76달러 (-1.33%)", "", "", "", "[yfinance](https://finance.yahoo.com video how-spacex-and-mangos-are-fueling-the-latest-etf-trends-161839932.html) AI vs 금리/인플레 공방 속에 기술주 전반의 밸류에이션 차익 압력으로 주가는 1.33% 하락했다."], ["Coupang", "중립~긍정", "뉴스 확인", "18.83달러\u003cbr\u003e+0.80달러 (+4.44%)", "", "", "", "[yfinance](https://finance.yahoo.com markets stocks articles coupang-cpng-jumps-410m-penalty-013737143.html) 4억 1천만 달러 규모의 공정위 개인정보 과징금 처분에 대한 법적 항소 개시 보도 호재로 4.44% 급등했다."], ["Rocket Lab", "중립~긍정", "뉴스 확인", "107.98달러\u003cbr\u003e+3.35달러 (+3.20%)", "", "", "", "[yfinance](https://finance.yahoo.com markets stocks articles next-spacex-top-analyst-suggests-180000853.html) SpaceX IPO 충행 이후 월가 애널리스트들의 대체 우주 탑픽(Top pick) 추천 뉴스 효과로 3.20% 상승했다."], ["Resolve AI", "중립", "뉴스 확인", "2.64달러\u003cbr\u003e+0.02달러 (+0.76%)", "", "", "", "[yfinance](https://finance.yahoo.com markets stocks articles rezolve-ai-taps-tcs-partnership-001429282.html) 3억 달러 규모 자사주 매입 방침 및 Microsoft 베테랑 영입 효과가 지지되며 0.76% 보합세를 유지했다."], ["Intuitive Machines", "중립~부정", "뉴스 확인", "22.72달러\u003cbr\u003e-0.64달러 (-2.74%)", "", "", "", "[yfinance](https://stocktwits.com news-articles markets equity spacex-ipo-reshapes-space-trade-shorts-piling-into-asts-spce cZK0nmWR7IJ) SpaceX로의 수급 쏠림에 따른 동종 업계 밸류에이션 부담이 지속되며 2.74% 추가 하락했다."]]}, {"type": "heading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "대상: 하나금융지주, 우리금융지주, DB손해보험, SCHD.", "autoBold": true}, {"type": "paragraph", "text": "금융주 섹터는 당일 시장의 **리스크 주의 경보**와 개별 악재들이 겹치며 동반 약세를 시현했습니다. 특히 **하나금융지주**는 롯데손해보험 인수전에 따른 이중 레버리지 비율 한도 압박 소식이 보도된 가운데, 당일 외국인(26억)과 기관(13억)의 동반 매도세가 쏟아지며 주가가 **3.94% 급락**하여 126,800원선으로 내려앉았습니다.", "autoBold": true}, {"type": "paragraph", "text": "**우리금융지주** 또한 산하 우리은행에서 또다시 40억 원 규모의 대출 사기 사건이 발생했다는 내부통제 무력화 악재 뉴스가 대대적으로 보도되며 주가에 찬물을 끼얹었습니다. 기관의 43억 원 순매도가 주가 하락의 동인이 되며 주가는 **2.72% 하락**했습니다.", "autoBold": true}, {"type": "paragraph", "text": "자본 확충 공시를 연이어 냈던 **DB손해보험** 역시 가계 대출 옥죄기가 실손 대출까지 번지는 리스크 보도 속에 기관의 46억 원 매도로 주가가 **1.24% 조정**되었습니다. 미국의 배당형 대표 ETF인 **SCHD**는 자산 쏠림 현상 경고 속에 지수 하락 압력을 고스란히 받아 **1.84% 조정을 보였습니다.**", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "대상: 현대차2우B, USD/KRW, 수출 또는 자동차 관련 신호.", "autoBold": true}, {"type": "paragraph", "text": "원/달러 환율은 직전 거래일 대비 **14.10원 급등한 1,527.41원**으로 장을 마쳤습니다. 글로벌 금리 고공행진 장기화 리스크로 환율 지표가 위험 한도를 다시 뚫고 올라갔으며, 이는 시장 전체에 강한 주의 신호를 부과하고 있습니다.", "autoBold": true}, {"type": "paragraph", "text": "환율의 급격한 상승 압력 속에, **현대차2우B**는 당일 **1.98% 하락한 248,000원**에 마감했습니다. 수급상으로는 외국인이 7억 4천만 원의 미미한 순매수세를 유입시켰으나, **기관이 92억 원에 이르는 대량 매도 폭탄**을 집행하여 주가 하락을 이끌었습니다. 뉴스상으로는 글로벌 1위 전기차 업체인 BYD가 현대차의 안방 시장을 공략하기 위해 국내 상륙을 정조준하고 있다는 위협 보도가 흘러나와 단기 센티멘트에 불리하게 작용했습니다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "대상: 삼성전자, Nvidia, SOXX/Nasdaq 관련 신호가 있는 경우.", "autoBold": true}, {"type": "paragraph", "text": "미국의 나스닥 지수가 1.34% 하락했으나, 필라델피아 반도체 지수는 **1.38% 상승 반등**을 이루며 엇갈린 흐름을 보였습니다. 국내 반도체 핵심인 **삼성전자**는 당일 **1.02% 상승한 346,500원**에 정착했습니다. 당일 외국인이 **6,680억 원의 대규모 매도**를 지속 출회하였음에도, **기관이 3,893억 원의 강력한 순매수**로 외인 매물을 받아내며 지수를 견인했습니다. 하나증권 리포트에서 삼성전자의 최근 주가 저평가 해소 필요성과 목표가 48만 원 의견을 기재한 점이 긍정적 지지 요인이 되었습니다.", "autoBold": true}, {"type": "paragraph", "text": "반면 AI 인프라 수혜주인 **이수페타시스**는 TIGER 200 IT ETF의 순자산 3조 원 돌파 소식 속에서도 외국인이 86억 원의 차익 실현 매물을 쏟아낸 여파로 **0.81%의 보합 수준 상승**에 머물렀습니다. 미국의 **Nvidia**는 인플레이션 우려 및 연방준비제도의 매파적 태도 전망 하에 기술주 전반의 매물 부담이 작용해 **1.33% 하락 조정**되었습니다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "대상: SCHD, Apple, Nvidia, Coupang, Rocket Lab, Resolve AI, Intuitive Machines.", "autoBold": true}, {"type": "paragraph", "text": "미국 포트폴리오는 시장 전반의 연준 금리 불안(VIX 12% 급등) 심리 속에서도 개별 기업들의 호재성 악재 소화 여부에 따라 주가 희비가 크게 엇갈렸습니다.", "autoBold": true}, {"type": "paragraph", "text": "**Coupang**은 4억 1,000만 달러 규모의 정부 개인정보 보호 과징금 명령에 공식적으로 법원 항소장을 접수하고 강력 대응하겠다는 소식이 시장에서 규제 불확실성 해소로 이해되며, 주가가 **4.44% 급등**해 18.83달러까지 회복했습니다. **Rocket Lab**은 월가 투자은행들이 SpaceX IPO에 따른 대안 투자처로 가장 강력한 기초 체력을 지녔다는 찬사 리포트(Next SpaceX)를 내놓은 효과로 **3.20% 상승**했습니다.", "autoBold": true}, {"type": "paragraph", "text": "반면, **Apple**은 쿡 CEO가 반도체 칩 제조 단가 급상승으로 인해 차세대 스마트폰의 소비자 가격 인상이 불가피하다는 경고 성격 인터뷰를 월스트리트저널(WSJ)에 전하며 주가가 **1.10% 하락**했습니다. **Intuitive Machines**는 SpaceX로의 투자 쏠림에 따른 공매도 기관의 유입 우려 보도가 겹치며 **2.74% 약세를 지속했습니다.**", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "paragraph", "text": "* **현대차2우B**: 중국 BYD의 전기차 국내 전격 진출 및 현대차 안방 안심지대 정조준 기획 뉴스 보도.", "autoBold": false}, {"type": "paragraph", "text": "* **하나금융지주**: 금융지주 브랜드 평판 6월 1위 뉴스 및 롯데손보 인수 자금 조달에 따른 금융당국의 이중 레버리지 규제 한도 도달 우려 뉴스.", "autoBold": false}, {"type": "paragraph", "text": "* **우리금융지주**: 우리은행 내부 직원의 40억 대출 금융 사기 횡령 사건 재발에 따른 금융감독원 즉각 검사 및 임종룡 회장 책임론 뉴스 부각.", "autoBold": false}, {"type": "paragraph", "text": "* **삼성전자**: 최대주주 소유주식 변동 상황 임원 지분 소유 보고서 DART 공시. 하나증권의 저평가 반론 목표가 48만원 리포트 뉴스.", "autoBold": false}, {"type": "paragraph", "text": "* **DB손해보험**: 가계 대출 조이기 규제가 보험약관 실손대출까지 확산된다는 우려 뉴스 및 후순위 채무증권 자본 발행결정 공시 유지.", "autoBold": false}, {"type": "paragraph", "text": "* **현대바이오**: 주요사항보고서(전환사채 발행 및 자산 취득) DART 공시 유지 및 하나금융의 100조 첨단산업 금융 공급 뉴스 연계.", "autoBold": false}, {"type": "paragraph", "text": "* **금호석유화학**: 자사 친환경 창호 '휴그린'의 여름철 리모델링 폭염 수요 급증 뉴스 및 화학 섹터 포스트워 복구 수혜주 기사 보도.", "autoBold": false}, {"type": "paragraph", "text": "* **이수페타시스**: 미래에셋 TIGER 200 IT ETF 순자산 3조 원 돌파 소식 속 구성 종목 PCB 밸류에이션 부각 뉴스.", "autoBold": false}, {"type": "paragraph", "text": "* **SCHD / AAPL / NVDA / CPNG / RKLB / RZLV / LUNR**: 쿠팡 4억 1천만 달러 과징금 법적 항소 개시 돌입 뉴스, 팀 쿡 CEO의 칩 비용 급등에 따른 폰 가격 인상 발언 기사 및 SpaceX IPO 머니 유입에 따른 우주 경쟁사 공매도 뉴스 반영.", "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **환율 및 변동성 지표의 추가 불안 여부**: 원/달러 환율이 1,527원선을 터치하고 VIX가 18.44포인트까지 치솟은 위험 국면에서, 글로벌 금융 자금의 아시아 신흥국 엑소더스가 심화되는지 살펴봐야 합니다.", "autoBold": false}, {"type": "paragraph", "text": "2. **우리은행 대출 사기 여파와 금융 밸류업 센티멘트**: 임종룡 회장 취임 이후 재차 발생한 내부통제 리스크가 금융지주의 밸류업 지수 편입 및 자사주 소각 전략에 규제적 패널티로 이어질 가능성을 모니터링해야 합니다.", "autoBold": false}, {"type": "paragraph", "text": "3. **삼성전자의 외국인 매도와 기관의 방어 한계**: 기관이 하루 3,800억 원 이상을 받아내며 346,500원선을 지켰으나, 6,600억 원이 넘는 외국인의 파상 매도 기조가 장기화될 경우 지지선 붕괴 우려를 점검해야 합니다.", "autoBold": false}, {"type": "paragraph", "text": "4. **쿠팡의 19달러 안착 및 우주주의 차별화**: 규제 항소 뉴스로 18.8달러까지 급등한 쿠팡이 19달러 저항선을 돌파할 수 있을지 여부와 Rocket Lab의 월가 추천 효과 지속성을 점검합니다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["**로컬 가격 및 수급 통계 대체 복구**: 당일 거래소 데이터 처리 오류에 대비하여 `pykrx_fallback` 모듈이 연동 작동하여 포트폴리오 가격 및 기관/외인 거래소 순매수 통계 데이터를 정상 복구했습니다."], "autoBold": false}, {"type": "list", "items": ["**해외 보유 자산 거래소 수급 정보 제약**: yfinance의 글로벌 제공 사양에 의해 미국 보유 자산(SCHD, AAPL, NVDA, CPNG, RKLB, RZLV, LUNR)의 실시간 세부 기관/외인 수급 데이터는 추적이 불가능해 공란 처리되었습니다."], "autoBold": false}, {"type": "list", "items": ["**DART 공시 연동**: `portfolio.yaml` 정책 설정에 따라 Tier 1, 2 종목 외에 `track_disclosure: true`가 입력된 Tier 3 자산 현대바이오의 주요 전환사채 결정 공시가 누락 없이 완벽히 추적 수집되었습니다."], "autoBold": false}]}, "view_model": {"schema": "kss-view-model.v1", "date": "2026-06-18", "as_of": "2026-06-18T07:30:32.815940+09:00", "timezone": "Asia/Seoul", "market_status": {"label": "주의", "score": 2, "reasons": ["환율 급등", "VIX 급등"], "reason": "환율 급등 · VIX 급등"}, "market_indicators": [{"name": "KOSPI", "symbol": "^KS11", "source": "pykrx_fallback", "as_of_date": "2026-06-17", "display_order": 0, "unit": "index", "risk_tags": [], "short_comment": "상승", "price": {"latest_close": 8864.24, "previous_close": 8726.5996, "close_7d_ago": 8096.9302, "recent_closes": [8096.9302, 7730.8198, 7763.9502, 8123.6201, 8545.9805, 8726.5996, 8864.24], "recent_dates": ["2026-06-09", "2026-06-10", "2026-06-11", "2026-06-12", "2026-06-15", "2026-06-16", "2026-06-17"], "change": 137.6404, "change_pct": 1.5773, "trend": "up"}, "volume": 571194217}, {"name": "KOSDAQ", "symbol": "^KQ11", "source": "pykrx
