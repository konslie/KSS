g", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "**하나금융지주**와 **우리금융지주**는 가격 상승과 외국인 순매수가 함께 나타났다. 하나금융지주는 DART의 **주식소각 정정**과 **자기주식취득결과보고서**가 주주환원 확인 재료로 들어왔고, naver_search_news에는 4대 금융 자사주 소각과 금리 전망 관련 기사가 포함됐다. 다만 기관은 두 종목 모두 순매도라서 당일 가격 반응은 외국인 수급 의존도가 높았다.", "autoBold": true}, {"type": "paragraph", "text": "**DB손해보험**은 가격은 올랐지만 외국인이 76억 원 순매도했고 기관이 101억 원 순매수했다. 입력 뉴스 중 광고성·연예성 제목은 투자 판단 근거로 쓰기 어렵고, 실제로 확인할 부분은 여행자보험 항공지연 보장 차이와 보험사기 사각지대 기사, 그리고 DART의 계열금융회사 약관에 의한 금융거래 공시다. **SCHD**는 미국 배당 ETF 비교 뉴스가 반복됐지만 국내 수급 데이터는 없으므로, 배당 ETF 간 상대 성과 논점만 확인한다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW**는 1,486.61원으로 직전 거래일 대비 -0.74%였고 7거래일 전 1,528.76원보다 낮다. 원화 강세 방향은 자동차 수출주의 환산 이익 측면에서는 부담으로 해석될 수 있지만, 이번 입력에서는 현대차2우B 관련 직접 가격 데이터가 -0.35%, 외국인 순매도 100억 원으로 약했고, 환율과 수급이 뚜렷하게 우호적인 조합은 아니었다.", "autoBold": true}, {"type": "paragraph", "text": "**현대차2우B**에는 DART 기준 **생산중단**, **특수관계인으로부터 기타유가증권매수**, **IR 개최** 공시가 확인됐다. naver_search_news에는 현대차 미국법인의 **2026년형 아이오닉 5 N 가격 대폭 인하** 기사가 포함됐으나, 수집된 제목만으로는 가격 인하의 수익성 영향 규모를 확정할 수 없다. 오늘은 공시 성격과 외국인 매도 지속 여부를 우선 관찰한다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "반도체 신호는 엇갈렸다. **삼성전자**는 6.27% 상승하고 외국인이 5,095억 원 순매수했으며, naver_search_news에는 **소부장 생태계 강화** 기사가 포함됐다. DART에는 자기주식처분 관련 공시와 임원·주요주주 특정증권 소유상황 공시가 다수 확인됐다.", "autoBold": true}, {"type": "paragraph", "text": "반면 **필라델피아반도체지수**는 -2.08%로 약세였고, **이수페타시스**는 가격이 +4.29%였지만 외국인이 165억 원 순매도해 가격과 수급이 엇갈렸다. **Nvidia**는 yfinance 기준 +0.33%였고 ASML 전망 상향 및 hyperscaler 실적 우려 뉴스가 함께 들어왔다. AI 기대는 유지되지만, 국내 대형주 수급과 해외 반도체 지수의 방향이 완전히 같지는 않았다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "미국 포트폴리오는 종목별 분산이 컸다. **Apple**은 메모리 가격 상승이 iPhone에 미칠 수 있다는 yfinance_news 제목과 함께 +4.01% 상승했고, **Nvidia**는 ASML 및 AI 거래 관련 뉴스가 있었지만 상승폭은 +0.33%로 제한적이었다. **SCHD**는 다른 배당 ETF와의 상대 성과·수익률 비교 뉴스가 반복됐고 가격은 +0.43%였다.", "autoBold": true}, {"type": "paragraph", "text": "성장·우주 관련 종목은 약했다. **Rocket Lab**은 Space Force 수주와 Neutron 테스트 마일스톤 기사에도 -3.31%, **Resolve AI**는 블록체인 데이터 구조 수요 기사에도 -3.98%, **Coupang**은 공정위 동일인 지정 집행정지 기사와 투자자 관심 기사 속에 -1.80%였다. **Intuitive Machines**는 달 탐사 운영 강화 기사가 있었지만 7거래일 흐름은 -16.81%로 약하다. 미국 종목은 국내 투자자 수급이 없으므로 뉴스와 가격 확인의 확신을 분리해서 봐야 한다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "list", "items": ["**현대차2우B / 현대자동차 DART**: [생산중단](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260713800350), [특수관계인으로부터기타유가증권매수](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710000577), [기업설명회(IR)개최](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710800714)가 확인됐다."], "autoBold": false}, {"type": "list", "items": ["**하나금융지주 DART**: [[기재정정]주식소각결정](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260714800361), [자기주식취득결과보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260714000187)가 확인됐다."], "autoBold": false}, {"type": "list", "items": ["**삼성전자 DART**: [주요사항보고서(자기주식처분결정)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260713000395), [자기주식처분결과보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710000585), [주식등의대량보유상황보고서(일반)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260710000678), 임원·주요주주 특정증권 소유상황 보고가 다수 있었다."], "autoBold": false}, {"type": "list", "items": ["**DB손해보험 DART**: [계열금융회사의약관에의한금융거래](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260713000454)가 확인됐다."], "autoBold": false}, {"type": "list", "items": ["**금융 뉴스**: naver_search_news에는 [4대 금융 자사주 소각](https://www.womentimes.co.kr/news/articleView.html?idxno=104417), [자체정상화·부실정리계획](https://weekly.hankooki.com/news/articleView.html?idxno=7174529), [우리은행 개인정보 유출 조사](http://www.rightknow.co.kr/news/articleView.html?idxno=34427)가 포함됐다."], "autoBold": false}, {"type": "list", "items": ["**반도체 뉴스**: naver_search_news에는 [삼성전자 소부장 생태계 강화](https://www.digitaltoday.co.kr/news/articleView.html?idxno=684439), [이수페타시스 주요공시](https://www.kdpress.co.kr/news/articleView.html?idxno=206962), [메모리 장비주 편입](http://www.fnnews.com/news/202607151803364774)이 포함됐다."], "autoBold": false}, {"type": "list", "items": ["**미국 뉴스**: yfinance_news에는 [Apple 메모리 가격 영향](https://finance.yahoo.com/video/what-rising-memory-chip-prices-could-mean-for-apples-iphones-204217792.html), [ASML 전망과 AI 거래](https://finance.yahoo.com/video/why-asmls-sales-forecast-lift-is-a-real-vote-of-confidence-for-the-ai-trade-142740257.html), [Coupang 동일인 지정 집행정지](https://finance.yahoo.com/markets/stocks/articles/south-korean-court-suspends-ftc-054535691.html), [Rocket Lab Space Force 및 Neutron 테스트](https://finance.yahoo.com/markets/stocks/articles/rocket-lab-rklb-down-5-181434468.html)가 포함됐다."], "autoBold": false}, {"type": "list", "items": ["**거시 뉴스**: CNBC Markets에는 Fed 의장 독립성 관련 기사, Buffett의 밸류에이션 언급, New York AI 데이터센터 모라토리엄 관련 기사가 포함됐다."], "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **삼성전자 외국인 순매수**가 단발성인지, 7거래일 외국인 누적 순매도 흐름을 되돌리는지 확인한다.", "autoBold": false}, {"type": "paragraph", "text": "2. **금융주 주주환원 공시**와 외국인 매수가 하나금융지주·우리금융지주 가격 흐름을 계속 지지하는지 본다.", "autoBold": false}, {"type": "paragraph", "text": "3. **이수페타시스**는 가격 상승과 외국인 순매도가 엇갈렸으므로 ETF 리밸런싱·메모리 장비주 뉴스의 직접성을 분리해서 확인한다.", "autoBold": false}, {"type": "paragraph", "text": "4. **USD/KRW 하락**과 현대차2우B 외국인 순매도가 자동차 우선주에 부담으로 이어지는지 관찰한다.", "autoBold": false}, {"type": "paragraph", "text": "5. **미국 성장주**는 Rocket Lab, Resolve AI, Intuitive Machines의 7거래일 약세가 뉴스 이벤트와 함께 완화되는지 확인한다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["국내 지수와 국내 종목의 최신 가격·수급은 대부분 **2026-07-15 직전 거래일** 기준이며, 보고일인 2026-07-16 장중 가격은 확정 데이터로 쓰지 않았다."], "autoBold": false}, {"type": "list", "items": ["`krx_open_api`와 `krx_investor_flows`는 **KRX_AUTH_KEY not set**으로 skipped 처리됐다. 보고서는 `pykrx_fallback`, `naver_finance`, `yfinance`, `dart`, `naver_search_news`, `CNBC Markets`, `yfinance_news`에 수집된 값만 사용했다."], "autoBold": false}, {"t
