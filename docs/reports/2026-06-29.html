tive-machines-insider-sale-as-space-stocks-heat-up/)에 330만 달러 내부자 매도 관련 뉴스가 수집됐다."]]}, {"type": "heading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "**하나금융지주**는 가격 상승과 외국인 순매수가 같이 확인됐지만 기관은 소폭 순매도였다. 수집 뉴스는 은행주 상승, 2분기 최대 실적 전망과 밸류에이션 매력, 대출 성장 제한 속 하반기 새 먹거리 탐색으로 묶이며, DART 공시는 **증권발행실적보고서**, **투자설명서**, **일괄신고추가서류**라 자금조달·증권발행 관련 확인 사항에 가깝다.", "autoBold": true}, {"type": "paragraph", "text": "**우리금융지주**는 가격이 올랐지만 기관 순매도와 외국인 순매수가 엇갈렸고, 수집된 주요 뉴스는 직접 관련성이 낮거나 확인이 필요한 항목이 섞여 있다. **DB손해보험**은 가격 상승과 기관 순매수가 있었지만 외국인은 순매도였고, DART의 **자본으로 인정되는 채무증권 발행결정 정정**, 최대주주등소유주식변동신고서, 대량보유상황보고서는 자본성 증권·지배구조 확인 항목으로 분류된다. **SCHD**는 국내 수급 데이터가 없고, 배당 ETF 지급액·저변동성 ETF 뉴스가 수집돼 국내 금융주 수급과는 별도로 봐야 한다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW**는 1,541.53원으로 직전 거래일 대비 4.95원, 0.32% 낮아졌지만 7거래일 기준으로는 1,537.56원보다 높다. **현대차2우B**는 216,500원으로 직전 거래일 대비 2.61% 상승했고, pykrx_fallback 기준 기관 11.0억 원, 외국인 10.7억 원 순매수가 확인됐다.", "autoBold": true}, {"type": "paragraph", "text": "수집 뉴스에서는 현대차의 **전북 2차 투자 조속 확정 요구**가 투자·생산 관련 확인 대상으로 남고, 코스피·코스닥 마감 시황은 시장 배경으로만 쓰는 것이 적절하다. GS25와 함께한 아이스크림 출시 뉴스는 프로모션 성격이 강해 포트폴리오 영향 판단의 핵심 근거에서 제외했다. 환율은 당일 소폭 내려 자동차 우선주에 부담을 키우는 방향으로 보기는 어렵지만, 7거래일 기준 원/달러 레벨은 여전히 높아 환율 민감도는 계속 관찰 대상이다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "**필라델피아반도체지수**는 13,203.57로 직전 거래일 대비 5.29% 하락했고, **삼성전자**는 323,000원으로 4.86% 하락했다. 삼성전자는 기관 순매수에도 외국인 순매도가 3조 7,842.9억 원으로 컸고, DART에는 임원·주요주주 특정증권 소유상황보고서 여러 건, 지속가능경영보고서 관련 자율공시, 풍문또는보도에대한해명(미확정)이 수집됐다.", "autoBold": true}, {"type": "paragraph", "text": "**이수페타시스**는 1.76% 상승했지만 외국인 440.0억 원 순매도와 기관 486.5억 원 순매수가 크게 갈렸다. **Nvidia**는 2026-06-26 종가 기준 1.64% 하락했고, 수집 뉴스 중 AI 반도체 관련 항목은 테마 확인에는 쓸 수 있으나 일부 뉴스는 직접 관련성 확인이 필요하다. 오늘 반도체는 AI 기대 뉴스보다 **SOX 급락**, 삼성전자 외국인 매도, 이수페타시스의 기관 매수 방어가 서로 엇갈리는 구도다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "미국 보유 종목은 국내 투자자별 수급이 없으므로 가격과 뉴스만 분리해서 해석해야 한다. 2026-06-26 종가 기준 **SCHD**, **Apple**, **Coupang**, **Rocket Lab**, **Intuitive Machines**는 직전 거래일 대비 상승했고, **Nvidia**와 **Resolve AI**는 하락했다. 다만 7거래일 기준으로는 SCHD를 제외한 미국 개별 종목들이 모두 낮아져 단기 반등과 최근 약세가 함께 보인다.", "autoBold": true}, {"type": "paragraph", "text": "뉴스 직접성은 종목별로 다르다. Apple은 중국산 메모리칩 구매 승인과 가격 인상 관련 뉴스가 수집됐고, Coupang은 시장 대비 하락과 월가 시각 관련 뉴스가 수집됐다. Rocket Lab은 13번째 Electron 발사와 월간 약세, Resolve AI는 3억 달러 자사주 매입 제안과 Visa·Mashreq·Rezolve AI의 UAE AI 캐시백 뉴스, Intuitive Machines는 내부자 매도와 인수 성장 기회 관련 뉴스가 확인됐다. Nvidia는 AI 반도체 뉴스가 있으나 일부 수집 항목은 직접 관련성이 낮아 영향 판단의 확신을 낮게 둔다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "paragraph", "text": "DART 공시는 총 15건이 수집됐다. **하나금융지주**는 [증권발행실적보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260626000503), [투자설명서(일괄신고)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260625000599), [일괄신고추가서류](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260625000588)가 확인됐다. **삼성전자**는 임원·주요주주 특정증권 소유상황보고서 여러 건, [지속가능경영보고서 관련 자율공시](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260626800871), [풍문또는보도에대한해명(미확정)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260624801004)이 수집됐다. **DB손해보험**은 [자본으로 인정되는 채무증권 발행결정 정정](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260629000009), [최대주주등소유주식변동신고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260624800900), [주식등의대량보유상황보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260624000441)가 확인됐다. **현대바이오**는 [전환사채매수선택권행사자지정](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260623000313)과 [증권발행결과](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260623900550)가 수집됐다.", "autoBold": false}, {"type": "paragraph", "text": "뉴스는 총 50건이 수집됐다. 시장 뉴스에서는 [CNBC Markets](https://www.cnbc.com/2026/06/28/trump-threatens-iran-with-annihilation-kuwait-bahrain-report-attacks.html)의 미국·이란 휴전과 호르무즈 운송 재개, [CNBC Markets](https://www.cnbc.com/2026/06/29/oil-prices-wti-brent-crude-us-iran-strikes-strait-hormuz-talks.html)의 유가와 중동 공급 우려, [CNBC Markets](https://www.cnbc.com/2026/06/29/ai-data-centers-heatwave-climate-risk-weather.html)의 AI 데이터센터 기상 리스크, [CNBC Markets](https://www.cnbc.com/2026/06/29/baidu-kunlunxin-hong-kong-ipo-50-billion-ai-chips.html)의 Baidu AI 칩 자회사 IPO 추진 뉴스가 매크로·AI 공급망 변수로 수집됐다. 개별 종목에서는 하나금융지주 2분기 실적 전망, 금호석유화학 SSBR, Rocket Lab 발사, Resolve AI 자사주 매입 제안, Intuitive Machines 내부자 매도 뉴스가 상대적으로 직접성이 있다. 프로모션·게임·일반 홍보성 뉴스는 투자 판단 근거에서 제외했다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **KOSDAQ 급등과 KOSPI 약보합의 괴리**: KOSDAQ은 8.13% 상승했지만 KOSPI는 0.20% 하락했고, 반도체 대형주는 약했다.", "autoBold": false}, {"type": "paragraph", "text": "2. **삼성전자 외국인 순매도**: 삼성전자는 외국인 순매도 3조 7,842.9억 원과 가격 4.86% 하락이 동시에 확인됐다.", "autoBold": false}, {"type": "paragraph", "text": "3. **금융주 내 수급 차별화**: 하나금융지주는 외국인 순매수가 컸고, 우리금융지주와 DB손해보험은 기관·외국인 수급 방향이 엇갈렸다.", "autoBold": false}, {"type": "paragraph", "text": "4. **자동차 우선주와 환율**: 현대차2우B는 외국인·기관 동반 순매수였고, USD/KRW는 당일 소폭 하락했지만 7거래일 기준으로는 높은 상태다.", "autoBold": false}, {"type": "paragraph", "text": "5. **미국 성장주의 7거래일 약세**: Rocket Lab, Intuitive Machines, Resolve AI 등은 직전 거래일 등락과 별개로 7거래일 기준 하락폭이 남아 있다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["`source.json`, `news.md`, `view_model.json`, `analysis_context.json`이 모두 생성됐고, 수집 범위는 보유 종목 15개, 뉴스 50건, 공시 15건이다."], "autoBold": false}, {"type": "list", "items": ["국내 가격은 `naver_finance`, 국내 수급은 `pykrx_fallback`, 주요 시장지표와 미국 종목 가격은 `yfinance` 기준으로 사용했다."], "autoBold": false}, {"type": "list", "items": ["미국 지수와 미국 종목 가격은 최신 수집 기준이 2026-06-26 종가인 항목이 포함돼 있으며, 국내 종목과 일부 시장지표는 2026-06-29 종가가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["`krx_open_api`와 `krx_investor_flows`는 `KRX_AUTH_KEY not set`으로 skipped 처리됐다."], "autoBold": false}, {"type": "list", "items": ["미국 종목은 국내 투자자별 수급 데이터가 없으므로 기관·외인 칸을 비웠다."], "autoBold": false}, {"type": "list", "items": ["일부 Naver·yfinance 뉴스는 종목 직접성이 낮거나 프로모션 성격이 있어 영향도 판
