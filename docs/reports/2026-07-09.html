SA awards 관련 평가와 우주경제주 기사가 포함됐다."]]}, {"type": "heading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "**하나금융지주**와 **우리금융지주**는 모두 직전 거래일 가격이 약세였지만 수급 방향은 달랐다. 하나금융지주는 기관 107.5억 순매수에도 외국인이 171.8억 순매도했고, 가격도 -3.62%로 외국인 매도와 같은 방향이었다. 우리금융지주는 기관 22.3억 순매도와 외국인 9.0억 순매수가 엇갈렸고, 가격은 -2.69%였다.", "autoBold": true}, {"type": "paragraph", "text": "**DB손해보험**은 151,400원으로 +0.87%였지만 외국인은 101.3억 순매도, 기관은 108.3억 순매수였다. 뉴스는 K-ICS 비율, 초개인화 헬스케어, 장마철 자동차보험 손해율처럼 보험업의 자본비율·상품·손해율 변수를 가리킨다. 금융주 전체로는 주주환원이나 방어주 성격보다 **외국인 매도와 규제·손해율 변수**를 함께 확인해야 하는 구간이다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW**는 1,505.57로 직전 거래일 대비 -1.52%였다. 원/달러 환율은 낮아졌지만 naver_search_news에는 이란 재공습과 호르무즈 봉쇄 공포 재점화, 원화 약세가 겹칠 경우 현대차·기아 수출 채산성에 완충 효과가 있을 수 있다는 내용이 포함됐다.", "autoBold": true}, {"type": "paragraph", "text": "**현대차2우B**는 211,000원으로 -0.94%였고 기관은 15.7억 순매도, 외국인은 82.8억 순매수였다. 가격은 약세였지만 외국인 수급은 우호적이라 당일 방향만으로 판단하기 어렵다. DART의 **풍문또는보도에대한해명(미확정)**은 실적 확정이 아니라 확인 공시 성격으로 분류해 보는 것이 맞다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "반도체는 **미국 지수와 국내 보유종목의 신호가 엇갈렸다**. 필라델피아반도체지수는 12,574.97로 +2.23%였고 Nvidia도 $204.12로 +3.65%였다. 반면 삼성전자는 -6.25%, 이수페타시스는 -10.41%였으며, 삼성전자는 외국인 8,709.6억 순매도와 가격 약세가 같은 방향이었다.", "autoBold": true}, {"type": "paragraph", "text": "뉴스 측면에서는 삼성전자 관련으로 AI 투자금의 빅테크 이동 가능성, 반도체주 변동성, 환율 1,500원 하회가 입력됐다. DART에는 **자기주식처분결정**, **IR 개최**, **잠정실적**, **최대주주등소유주식변동신고서**가 포함됐다. 국내 반도체는 공시 확인과 AI 기대가 있어도, 이번 입력에서는 **외국인 수급과 가격 하락**이 더 강한 신호다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "미국 종목은 국내 기관·외국인 수급이 없으므로 가격과 뉴스 직접성을 분리해서 본다. **Apple**은 $313.39로 +0.88%였고, yfinance_news에는 Broadcom과의 300억 달러 이상 AI 칩 계약 및 Broadcom 주가 반응이 포함됐다. **Nvidia**는 +3.65%였지만 시총 1조 달러 감소, AI 지출의 자본시장 민감도라는 뉴스가 있어 가격 반등과 뉴스 리스크가 공존한다.", "autoBold": true}, {"type": "paragraph", "text": "**Coupang**은 $19.00으로 +2.54%였고 CPNG 평가 및 주가 변동 기사가 포함됐다. **Rocket Lab**은 $83.35로 -0.07%였지만 7거래일 기준 -14.96%라 변동성 확인이 필요하다. **Resolve AI**와 **Intuitive Machines**는 각각 -4.69%, -4.65%였고, 관련 뉴스는 AI·우주 테마의 사업 기대와 평가 기사 중심이다. **SCHD** 관련 뉴스는 배당 ETF 일반 콘텐츠가 많아 직접 이벤트로 보기는 어렵다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "list", "items": ["CNBC Markets: [U.S. military launches new Iran strikes as Trump says 'not sure' he wants deal](https://www.cnbc.com/2026/07/08/trump-iran-war-deal-hormuz-strait-ceasefire.html)는 지정학·에너지 리스크로 볼 수 있다."], "autoBold": false}, {"type": "list", "items": ["CNBC Markets: [Fed officials were split on direction of interest rates at last meeting, minutes show](https://www.cnbc.com/2026/07/08/fed-minutes-june-2026-.html)는 금리 경로 불확실성 입력이다."], "autoBold": false}, {"type": "list", "items": ["naver_search_news: [美, 이란 재공습...호르무즈 봉쇄 공포 재점화](https://www.g-enews.com/view.php?ud=2026070907255678872bd56fbc3c_1)는 환율·수출주 해석에 연결되는 뉴스다."], "autoBold": false}, {"type": "list", "items": ["naver_search_news: [신한 ‘시스템 안전’ vs 하나 ‘본사 이전’… 시금고 2파전 [17조 인천...](https://www.kyeonggi.com/article/20260708580491)는 하나금융지주 관련 금융 경쟁 이슈로 입력됐다."], "autoBold": false}, {"type": "list", "items": ["naver_search_news: [장마철 車보험 손해율 '빨간불'… '8주룰' 표류에 손보사 깜깜](https://www.mt.co.kr/finance/2026/07/09/2026070820055269137)는 손해보험업 손해율·규제 변수로 입력됐다."], "autoBold": false}, {"type": "list", "items": ["naver_search_news: [짐 크레이머 “삼성전자 실적 발표 이후 AI 투자금, 빅테크로 이동 가능...](https://www.segye.com/newsView/20260709504326?OutUrl=naver), [[마켓 프리뷰] 역대급 변동성에 반도체주 '털썩'…환율 1500원 하회](https://biz.sbs.co.kr/article_hub/20000321450?division=NAVER)는 반도체 변동성 입력이다."], "autoBold": false}, {"type": "list", "items": ["naver_search_news: [[단독] ‘1등’ 미래에셋의 반칙…TIGER 반도체 ETF, 지수 규정 어기고 ...](https://biz.chosun.com/stock/stock_general/2026/07/09/VKJ5J6OSZZHGNIDVPGNQIQ47ZA/?utm_source=naver\u0026utm_medium=original\u0026utm_campaign=biz)는 이수페타시스 관련 입력으로 포함됐다."], "autoBold": false}, {"type": "list", "items": ["DART: 현대 graph", "text": "1. **국내 지수 급락 지속성**: KOSPI -5.35%, KOSDAQ -5.56%가 위험도 `주의`의 직접 원인이다.", "autoBold": false}, {"type": "paragraph", "text": "2. **삼성전자 외국인 매도**: 삼성전자는 외국인 순매도 8,709.6억과 가격 -6.25%가 같은 방향이다.", "autoBold": false}, {"type": "paragraph", "text": "3. **금융주 수급 차별화**: 하나금융지주는 기관 순매수와 외국인 순매도가 충돌하고, DB손해보험도 같은 구조다.", "autoBold": false}, {"type": "paragraph", "text": "4. **환율 완화와 자동차 외국인 매수**: USD/KRW는 -1.52%였고 현대차2우B는 가격 약세에도 외국인 순매수 82.8억이 확인됐다.", "autoBold": false}, {"type": "paragraph", "text": "5. **미국 성장주 내부 차별화**: Apple·Nvidia·Coupang은 상승했지만 Resolve AI·Intuitive Machines는 하락했고 Rocket Lab은 7거래일 기준 -14.96%다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["`source.json`, `news.md`, `view_model.json`, `analysis_context.json`은 모두 생성됐다."], "autoBold": false}, {"type": "list", "items": ["국내·미국 보유종목 가격 기준일은 **2026-07-08 직전 거래일 종가**다. 2026-07-09 장 마감 가격이 아니다."], "autoBold": false}, {"type": "list", "items": ["`krx_open_api`와 `krx_investor_flows`는 `KRX_AUTH_KEY not set`으로 skipped 처리됐다."], "autoBold": false}, {"type": "list", "items": ["수집 중 일부 KRX 같은 날 지수·거래대금 프레임이 비어 있다는 오류가 있었지만, view model에는 `pykrx_fallback`, `naver_finance`, `yfinance` 기반 가격·수급·7거래일 데이터가 반영됐다."], "autoBold": false}, {"type": "list", "items": ["CNBC 정치 기사, 일반 투자 마케팅형 ETF 기사, 행사성·지역성 보도, 직접 관련성이 낮은 기사들은 포트폴리오 핵심 근거에서 제외하거나 낮은 관련성으로 처리했다."], "autoBold": false}]}, "view_model": {"schema": "kss-view-model.v1", "date": "2026-07-09", "as_of": "2026-07-09T07:32:48.536053+09:00", "timezone": "Asia/Seoul", "market_status": {"label": "주의", "score": 2, "reasons": ["KOSPI 급락", "KOSDAQ 급락"], "reason": "KOSPI 급락 · KOSDAQ 급락"}, "market_indicators": [{"name": "KOSPI", "symbol": "^KS11", "source": "pykrx_fallback", "as_of_date": "2026-07-08", "display_order": 0, "unit": "index", "risk_tags": ["시장 약세"], "short_comment": "급락", "price": {"latest_close": 7246.79, "previous_close": 7656.3101, "close_7d_ago": 8476.4805, "recent_closes": [8476.4805, 8303.4102, 764
