 "**하나금융지주**와 **우리금융지주**는 급락장 속에서도 가격 상승이 확인됐다. 하나금융지주는 기관 순매수 333억 원과 외국인 순매도 205억 원이 엇갈렸고, naver_search_news에는 금융지주가 급락장 속 방어주로 부각됐다는 기사와 금리·실적 기대 관련 기사가 수집됐다. DART에는 **기업설명회(IR)개최**, **지속가능경영보고서**, **증권발행실적보고서**가 확인돼 실적 커뮤니케이션과 자본시장 공시를 함께 확인해야 하는 구간이다.", "autoBold": true}, {"type": "paragraph", "text": "**우리금융지주**는 기관 순매수 165억 원과 외국인 순매수 4억 원이 가격 상승과 같은 방향이었다. 다만 수집된 종목 뉴스는 여성 임원 비중 관련 기사 1건으로, 당일 가격 흐름의 직접 원인으로 단정할 수 있는 근거는 제한적이다.", "autoBold": true}, {"type": "paragraph", "text": "**DB손해보험**은 가격이 +6.91%였지만 외국인은 69억 원 순매도했고 기관은 100억 원 순매수했다. 수집 뉴스는 보험사 PF 투자 부담, 5세대 실손보험 전환, 상반기 M\u0026A 시장 규모 관련 기사이며, DART에는 **자본으로 인정되는 채무증권 발행결정 정정** 공시가 확인됐다. 보험주는 가격 반등보다 자본·위험자산·실손보험 전환 이슈를 분리해서 봐야 한다. **SCHD**는 배당 ETF 일반 기사와 10년물 금리 신호 기사 중심이어서 직접 이벤트 확신도는 낮다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW**는 1,537.07원으로 직전 거래일 대비 -11.54원(-0.75%)이었지만 7거래일 기준으로는 소폭 상승 흐름이다. 같은 최신 종가 기준으로 **현대차2우B**는 212,000원, -3.64%였고 기관과 외국인이 모두 순매도했다. 환율 자체는 급등 신호가 아니었지만, 자동차 우선주 가격과 수급은 당일 우호적이지 않았다.", "autoBold": true}, {"type": "paragraph", "text": "DART에는 현대자동차의 **영업(잠정)실적(공정공시)**과 **지속가능경영보고서등관련사항(자율공시)**이 확인됐다. 전자는 실적 확인 축, 후자는 지속가능성·기업가치 공시 축으로 분류된다. naver_search_news의 가상자산사업자·단일종목 레버리지 ETF·영남권 첨단산업 투자 제목은 직접 관련성이 낮아 현대차2우B 해석의 핵심 근거로 쓰지 않는다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "반도체는 오늘 가장 부담이 큰 축이다. **필라델피아반도체지수**는 12,626.22로 -5.44%였고, **삼성전자**는 286,000원으로 -9.06%였다. 삼성전자는 외국인 순매도 14,715억 원, 기관 순매도 6,162억 원이 함께 수집돼 가격 약세와 수급 부담이 같은 방향이다. DART에는 임원·주요주주 특정증권 소유상황보고서 다수와 **장래사업·경영계획 공정공시 및 정정**, **지속가능경영보고서 관련 공시**가 확인됐다.", "autoBold": true}, {"type": "paragraph", "text": "**이수페타시스**도 -9.86%였고 외국인은 594억 원 순매도했다. 기관은 587억 원 순매수였지만 외국인 매도가 가격 약세와 같은 방향이라 수급 확인은 혼재돼 있다. 수집 뉴스 중 대구치맥페스티벌 관련 제목은 직접 투자 이슈로 보기 어려워 제외하고, 코스피 지수선물·옵션 시장에서 삼성전자·SK하이닉스가 흔들렸다는 naver_search_news 제목만 시장 압력 참고 자료로 본다.", "autoBold": true}, {"type": "paragraph", "text": "**Nvidia**는 194.83달러로 -1.39%였고, yfinance_news에는 NVIDIA 인프라 기반 AI-RAN 검증 기사와 직접 관련성이 약한 기술주·우주주 제목이 함께 수집됐다. AI 인프라 기대가 완전히 사라졌다는 근거는 없지만, 오늘 수집값에서는 SOX·삼성전자·이수페타시스·Nvidia가 모두 가격 약세로 모였다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "미국 종목은 국내 기관·외국인 수급이 없으므로 가격과 뉴스의 직접성을 분리해서 본다. **Apple**은 308.63달러로 +4.84%였고 CNBC Markets에는 Trump가 tariff reversal 전 Apple, Nvidia 등 기술주를 매수했다는 기사가 수집됐다. 이 기사는 정치·거래 공개 성격이 강해 Apple의 사업 이벤트로 해석하지 않는다. yfinance_news의 AI로 인한 기기 비용 증가는 Apple 기기 수요와 비용 논의의 참고 신호로만 둔다.", "autoBold": true}, {"type": "paragraph", "text": "**Coupang**은 18.56달러로 +2.37%였고, yfinance_news에는 데이터 과징금 규제 충돌, 미국 의회의 한국 규제 비판, 밸류에이션 관련 제목이 모두 직접 수집됐다. 규제 이슈는 가격 상승과 별개로 계속 확인해야 할 리스크다.", "autoBold": true}, {"type": "paragraph", "text": "**Rocket Lab**은 100.46달러로 7거래일 기준 +17.62%였고, CEO의 80억 달러 경쟁 전략 관련 yfinance_news 제목이 수집됐다. **Resolve AI**는 AI 커머스 사업 저평가 발언과 직전 급등 기사에도 최신 가격이 -7.79%로 조정됐고, **Intuitive Machines**는 NASA 달 기지 계획 관련 기사에도 -3.07%였다. **SCHD**는 배당 ETF 및 10년물 금리 기사 중심이라 종목 고유 촉매보다는 금리 민감도 확인 자료로 본다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "paragraph", "text": "**공시**", "autoBold": false}, {"type": "table", "className": "data-table", "header": ["종목", "공시", "일자", "출처"], "rows": [["현대차2우B", "영업(잠정)실적(공정공시)", "2026-07-01", "[DART](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260701800788)"], ["현대차2우B", "지속가능경영보고서등관련사항(자율공시)", "2026-06-30", "[DART](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260630800715)"], ["하나금융지주", "기업설명회(IR)개최(안내공시)", "2026-07-02", "[DART](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260702800880)"], ["하나금융지주", "지속가능경영보고서등관련사항(자율공시)", "2026-06-30", "[DART](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260630800995)"], ["하나금융지주", "임원ㆍ주요주주특정증권등소유상황보고서", "2026-06-30", "[DART](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260630000765)"], ["하나금융지주", "증권발행실적보고서", "2026-06-26", "[DART](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260626000
