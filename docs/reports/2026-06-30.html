, "뉴스 확인", "20.97달러\u003cbr\u003e+1.18달러 (+5.96%)", "", "", "-8.23%", "`yfinance_news`에 Intuitive Machines 주가 하락 설명 기사와 우주경제 관련 뉴스가 수집됐다."]]}, {"type": "heading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "**하나금융지주**와 **우리금융지주**는 가격 상승과 외국인 순매수가 함께 잡혔다. 하나금융지주는 기관이 소폭 순매도였지만 외국인 순매수 규모가 더 컸고, `naver_search_news`에는 4대 금융의 상반기 순익 전망치가 10조8,949억 원으로 집계됐다는 기사와 은행장 인선 관련 뉴스가 포함됐다. DART의 증권발행실적보고서, 투자설명서, 일괄신고추가서류는 자금조달·증권발행 관련 확인 사항으로 분류된다.", "autoBold": true}, {"type": "paragraph", "text": "**DB손해보험**은 가격은 상승했지만 외국인이 순매도해 수급 확인은 엇갈렸다. `naver_search_news`의 무·저해지 보험해지율 강화, 5세대 실손 요율 인상 수혜, 보험사 대출 관련 뉴스는 보험업 수익성과 리스크 관리 이슈로 연결된다. DART에는 자본으로 인정되는 채무증권 발행결정 정정, 최대주주등소유주식변동신고서, 주식등의대량보유상황보고서가 수집돼 자본·지분 관련 공시 확인이 필요하다.", "autoBold": true}, {"type": "paragraph", "text": "SCHD는 국내 수급 지표가 없고 가격은 직전 거래일 대비 **-0.50%**였지만 7거래일로는 **+0.22%**였다. `yfinance_news`의 SCHD/VYM 비교와 저변동 월배당 ETF 뉴스는 배당 ETF 선호와 방어적 성격을 확인하는 참고자료이며, 특정 매수·매도 판단 근거로 확대하지 않는다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW**는 1,542.04원으로 직전 거래일 대비 **-0.29%**였고, 7거래일 추세는 `up_7d`로 수집됐다. **현대차2우B**는 가격 상승과 기관·외국인 동반 순매수가 확인됐지만, 7거래일 기준으로는 **-10.17%**라 단기 반등과 최근 약세 흐름을 분리해서 봐야 한다.", "autoBold": true}, {"type": "paragraph", "text": "`naver_search_news`에는 현대차 차값 인상 효과 기사, 현대차가 포함된 우주기업 EU·나토 협력 기사, AI·스테이블코인 포럼에서 현대차 상무 발표가 언급된 기사가 수집됐다. 이 중 차값 인상 뉴스는 자동차 수요와 가격 부담을 직접 확인할 수 있는 항목이고, 나머지는 현대차 언급이 포함됐으나 우선주 가치에 대한 직접 영향은 확인이 필요하다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "반도체는 지수와 종목 수급이 같은 방향으로 움직이지 않았다. **필라델피아반도체지수**는 13,709.66으로 **+3.83%**였고 **Nvidia**도 **+1.27%**였지만, **삼성전자**는 **-4.86%**였으며 외국인 순매도 **3조8,498억 원**이 수집됐다. DART의 삼성전자 장래사업ㆍ경영계획 공정공시 및 정정 공시는 전략·사업계획 확인 항목이고, 지속가능경영보고서 관련 자율공시와 임원·주요주주 특정증권 소유상황보고서도 함께 수집됐다.", "autoBold": true}, {"type": "paragraph", "text": "**이수페타시스**는 가격은 상승했지만 외국인 순매도와 기관 순매수가 엇갈렸다. `naver_search_news`의 반도체 입지 관련 정치권 뉴스는 산업 입지와 정책 논쟁에 가까우며, 종목 실적이나 수주로 바로 연결된 사실은 입력 파일에 없다. 따라서 오늘 반도체 관찰은 미국 AI·기술주 강세와 국내 대형주 외국인 매도의 괴리를 중심으로 보는 편이 안전하다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "미국 포트폴리오는 국내 투자자 수급이 없으므로 뉴스와 가격만 분리해서 본다. **Rocket Lab**은 **+15.93%**로 가장 큰 당일 상승률을 보였고, `yfinance_news`에는 Iridium 거래를 통한 위성사업 확장 뉴스가 수집됐다. CNBC Markets도 Rocket Lab 급등과 SpaceX 관련 강세 베팅을 다뤘다.", "autoBold": true}, {"type": "paragraph", "text": "**Rezolve AI**는 **+7.88%**였고, `yfinance_news`에는 3억 달러 자사주 매입 제안과 Visa·Mashreq 연계 AI 캐시백 뉴스가 수집됐다. **Intuitive Machines**는 **+5.96%**였지만, 수집 뉴스에는 주가 하락 설명 기사와 우주경제 관련 비교 기사가 함께 있어 방향성 판단의 확신은 낮다.", "autoBold": true}, {"type": "paragraph", "text": "**Apple**과 **Coupang**은 가격 흐름이 상대적으로 약했다. Apple 뉴스는 Magnificent 7 및 빅테크 전반 기사 중심이라 직접 관련성이 약하고, Coupang은 `yfinance_news`에 주가 하락과 월가 의견 관련 직접 뉴스가 수집됐다. SCHD는 배당 ETF 비교 기사 중심이라 포트폴리오 성격 점검 자료로만 본다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "list", "items": ["DART: **하나금융지주**는 [증권발행실적보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260626000503), [투자설명서(일괄신고)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260625000599), [일괄신고추가서류](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260625000588)가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["DART: **삼성전자**는 [장래사업ㆍ경영계획 공정공시 정정](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260629801230), [장래사업ㆍ경영계획 공정공시](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260629801143), 임원ㆍ주요주주특정증권등소유상황보고서, 지속가능경영보고서 관련 자율공시, 풍문또는보도에대한해명(미확정)이 수집됐다."], "autoBold": false}, {"type": "list", "items": ["DART: **DB손해보험**은 [자본으로 인정되는 채무증권 발행결정 정정](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260629000009), 최대주주등소유주식변동신고서, 주식등의대량보유상황보고서가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["DART: **현대바이오**는 [전환사채매수선택권 행사자 지정](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260623000313)과 [증권발행결과](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260623900550)가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["금융 뉴스: `naver_search_news`에 [4대 금융 상반기 순익 전망](https://www.sidae.com/article/2026062910172959173), [은행장 인선](https://www.mt.co.kr/finance/2026/06/30/2026062919475988672), [증권사 자본 확충](https://www.digitaltoday.co.kr/news/articleView.html?idxno=679299), [롯데손보 M\u0026A](https://dealsite.co.kr/articles/164425) 관련 뉴스가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["자동차/환율 뉴스: `naver_search_news`에 [현대차 차값 인상 효과](https://biz.sbs.co.kr/article_hub/20000319608?division=NAVER) 기사가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["반도체 뉴스: `yfinance_news`에 [Samsung \u0026 SK Hynix의 한국 AI 투자](https://finance.yahoo.com/video/why-samsung-sk-hynix-investing-150605340.html), `naver_search_news`에 [반도체 입지 논쟁](https://www.kyongbuk.co.kr/news/articleView.html?idxno=4076976) 관련 뉴스가 수집됐다."], "autoBold": false}, {"type": "list", "items": ["미국 성장주 뉴스: `yfinance_news`에 [Rocket Lab의 Iridium 관련 위성사업 확장](https://finance.yahoo.com/video/rocket-lab-expands-satellite-business-194200619.html), [Rezolve AI의 3억 달러 자사주 매입 제안](https://finance.yahoo.com/markets/stocks/articles/why-rezolve-ai-plc-rzlv-201857619.html), [Intuitive Machines 주가 하락 설명](https://www.fool.com/investing/2026/06/29/intuitive-machines-stock-is-falling-what-investors/)이 수집됐다."], "autoBold": false}, {"type": "list", "items": ["제외 관점: CNBC Markets의 정치·세금·규제 일반 기사와 일부 Naver 검색 결과는 포트폴리오 직접성이 낮아 핵심 영향으로 확대하지 않았다."], "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **삼성전자 외국인 순매도**가 단기 가격 약세와 계속 맞물리는지 확인한다.", "autoBold": false}, {"type": "paragraph", "text": "2. **금융주**는 실적 전망 뉴스와 외국인 수급이 가격을 지지하는지, 기관 순매도와 엇갈리는 종목은 없는지 본다.", "autoBold": false}, {"type": "paragraph", "text": "3. **USD/KRW 1,542원대**와 현대차2우B 수급이 자동차 우선주 반등을 뒷받침하는지 확인한다.", "autoBold": false}, {"type": "paragraph", "text": "4. **Rocket Lab·Rezolve AI·Intuitive Machines**는 뉴스 직접성이 높은 항목과 가격 급등을 분리해서 추적한다.", "autoBold": false}, {"type": "paragraph", "text": "5. 국내 Naver 검색 뉴스 중
