지주의 **동양생명 완전자회사 추진**이 직접적인 전략 이슈로 수집됐다. DB손해보험은 **장마철 대응**, **보험계약대출 증가**, **자동차보험 손해율 관리** 뉴스가 함께 있어 손해율과 가입자 리스크를 관찰해야 한다. **SCHD**는 국내 금융주와 달리 수급 데이터가 없고, 수집 뉴스는 배당 ETF의 배당수익률과 성장 잠재력 비교에 가까워 국내 금융주 약세의 직접 근거로 보기는 어렵다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "**USD/KRW**는 1,535.00원으로 직전 거래일 대비 0.50% 낮아졌지만, 7거래일 기준으로는 1,525.42원에서 높아진 상태다. **현대차2우B**는 211,000원으로 직전 거래일 대비 3.87% 하락했고, pykrx_fallback 기준 기관 76.6억 원, 외국인 33.1억 원 순매도가 동시에 확인됐다.", "autoBold": true}, {"type": "paragraph", "text": "수집 뉴스 중 현대차그룹 관련 직접성이 있는 항목은 새만금 데이터센터 투자 언급과 제네시스 마그마 GT 등 제품·브랜드 뉴스다. 가격과 외국인·기관 수급은 자동차 우선주에 부담으로 잡혔지만, 수집 뉴스는 실적 수치나 주주환원 공시가 아니라 투자·제품·행사 성격이므로 영향도 판단은 가격·수급 쪽에 더 무게가 있다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "**필라델피아반도체지수**는 13,203.57로 직전 거래일 대비 5.29% 하락했고, **삼성전자**도 339,500원으로 5.30% 하락했다. 삼성전자는 외국인 2조 142.3억 원, 기관 1조 2,094.2억 원 순매도로 가격과 수급이 같은 방향이었다. DART에는 임원·주요주주 특정증권 소유상황보고서 여러 건, 지속가능경영보고서 관련 자율공시, 풍문또는보도에대한해명(미확정)이 수집됐다.", "autoBold": true}, {"type": "paragraph", "text": "**이수페타시스**는 가격이 1.64% 하락했지만 외국인 47.0억 원, 기관 101.7억 원 순매수로 가격과 수급이 엇갈렸다. **Nvidia**는 yfinance 기준 1.64% 하락했고, 개별 yfinance_news 수집은 실패했다. 오늘 반도체는 AI 기대보다 **SOX 급락**, 삼성전자 대규모 외국인·기관 매도, 이수페타시스의 수급 방어가 서로 다른 신호로 나타난 날이다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "미국 보유 종목은 국내 투자자별 수급이 없으므로 가격과 뉴스 수집 여부를 분리해서 봐야 한다. 직전 거래일 기준으로 **Apple**, **Coupang**, **Rocket Lab**, **Intuitive Machines**, **SCHD**는 상승했고, **Nvidia**와 **Resolve AI**는 하락했다. 다만 7거래일 기준으로는 Apple, Nvidia, Coupang, Rocket Lab, Resolve AI, Intuitive Machines가 모두 낮아졌고 SCHD만 소폭 높았다.", "autoBold": true}, {"type": "paragraph", "text": "뉴스 직접성은 종목별로 차이가 크다. Rocket Lab은 NASA의 소형 발사체 관련 역할, 당일 주가 상승, 10회 연속 발사 성공 뉴스가 함께 수집됐다. Resolve AI는 3억 달러 자사주 매입 제안과 Visa·Mashreq·Rezolve AI의 UAE AI 캐시백 뉴스가 수집됐지만 가격은 약했다. Intuitive Machines는 인수와 성장 기회 관련 뉴스가 수집됐고, Apple·Nvidia·Coupang은 yfinance_news 수집 실패로 가격 외 개별 뉴스 확인이 제한된다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "paragraph", "text": "DART 공시는 총 14건이 수집됐다. **하나금융지주**는 [증권발행실적보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260626000503), [투자설명서(일괄신고)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260625000599), [일괄신고추가서류](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260625000588)가 확인됐다. **삼성전자**는 임원·주요주주 특정증권 소유상황보고서 여러 건, [지속가능경영보고서 관련 자율공시](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260626800871), [풍문또는보도에대한해명(미확정)](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260624801004)이 수집됐다. **DB손해보험**은 [최대주주등소유주식변동신고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260624800900)와 [주식등의 대량보유상황보고서](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260624000441), **현대바이오**는 [전환사채매수선택권행사자지정](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260623000313)과 [증권발행결과](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260623900550)가 확인됐다.", "autoBold": false}, {"type": "paragraph", "text": "뉴스는 총 42건이 수집됐다. 시장 뉴스에서는 [CNBC Markets](https://www.cnbc.com/2026/06/26/us-strikes-iran-strait-of-hormuz-ceasefire.html)의 이란·호르무즈 해협 긴장, [CNBC Markets](https://www.cnbc.com/2026/06/26/oil-prices-middle-east-iran-strait-of-hormuz-opec-iraq-wti-brent-crude.html)의 미국 원유 70달러 하회, [CNBC Markets](https://www.cnbc.com/2026/06/26/trump-warsh-fed-rate-cuts-inflation.html)의 인플레이션 4% 상회와 Fed 관련 뉴스가 매크로 변수로 수집됐다. 개별 종목에서는 우리금융지주 동양생명 완전자회사 추진, DB손해보험 손해율·보험계약대출 이슈, 금호석유화학 신용도 및 등급전망 하향, Rocket Lab 발사 성과, Resolve AI 자사주 매입 제안이 상대적으로 직접성이 높다. 부산모빌리티쇼 현장, 웰니스 공간, 일반 투자자 인터뷰처럼 포트폴리오 가치 판단과 직접 관련성이 낮은 항목은 해석에서 낮은 비중으로 다뤘다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **국내 지수 약세 지속성**: KOSPI는 5.81%, KOSDAQ은 4.10% 하락했고 시장 위험도는 주의로 산정됐다.", "autoBold": false}, {"type": "paragraph", "text": "2. **삼성전자 외국인·기관 동반 매도**: 직전 거래일 외국인 순매도 2조 142.3억 원, 기관 순매도 1조 2,094.2억 원이 확인됐다.", "autoBold": false}, {"type": "paragraph", "text": "3. **금융주 수급 부담**: 하나금융지주와 우리금융지주는 외국인·기관 동반 순매도였고, DB손해보험은 외국인 순매도와 손해율 뉴스가 함께 수집됐다.", "autoBold": false}, {"type": "paragraph", "text": "4. **미국 성장주 단기 반등과 7일 약세의 괴리**: Rocket Lab과 Intuitive Machines는 직전 거래일 상승했지만 7거래일 기준으로는 각각 21.71%, 12.90% 낮다.", "autoBold": false}, {"type": "paragraph", "text": "5. **뉴스 수집 실패 종목의 낮은 확신**: Apple, Nvidia, Coupang은 가격 데이터는 있으나 yfinance_news 수집이 실패해 개별 이슈 해석은 제한적이다.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["`source.json`, `news.md`, `view_model.json`, `analysis_context.json`이 모두 생성됐고, 수집 범위는 보유 종목 15개, 뉴스 42건, 공시 14건이다."], "autoBold": false}, {"type": "list", "items": ["오늘은 토요일인 2026-06-27 실행분이므로 가격과 시장 지표는 대부분 2026-06-26 직전 거래일 종가 기준으로 작성했다."], "autoBold": false}, {"type": "list", "items": ["`krx_open_api`와 `krx_investor_flows`는 `KRX_AUTH_KEY not set`으로 skipped 처리됐다."], "autoBold": false}, {"type": "list", "items": ["국내 가격은 `naver_finance`, 국내 수급은 `pykrx_fallback` 기준으로 사용했다."], "autoBold": false}, {"type": "list", "items": ["`yfinance_news`는 Apple, Nvidia, Coupang에서 timeout 또는 receive failure로 실패했다. 이 세 종목은 가격 기반 해석만 가능하며 개별 뉴스 근거는 없다."], "autoBold": false}, {"type": "list", "items": ["미국 종목은 국내 투자자별 수급 데이터가 없으므로 기관·외인 칸을 비웠다."], "autoBold": false}]}, "view_model": {"schema": "kss-view-model.v1", "date": "2026-06-27", "as_of": "2026-06-27T16:38:49.595330+09:00", "timezone": "Asia/Seoul", "market_status": {"label": "주의", "score": 2, "reasons": ["KOSPI 급락", "KOSDAQ 급락"], "reason": "KOSPI 급락 · KOSDAQ 급락"}, "market_indicators": [{"name": "KOSPI", "symbol": "^KS11", "source": "yfinance", "as_of_date": "2026-06-26", "display_order": 0, "unit": "index", "risk_tags": ["시장 약세"], "short_comment": "급락", "price": {"latest_close": 8411.21, "previous_close": 8930.2998, "close_7d_ago": 9063.8398, "recent_closes": [9063.8398, 9052.4199, 9114.5498, 8203.8398, 8471.0195, 8930.2998, 8411.21], "recent_dates": ["2026-06-18", "2026-06-19", "2026-06-22", "2026-06-23", "2026-0
