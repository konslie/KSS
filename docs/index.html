"[yfinance](https://www.thestreet.com/crypto/markets/why-ai-investor-aschenbrenner-is-shorting-nvidia-buying-hive) AI 채굴/반도체 공방 뉴스 및 엔비디아 채권 발행 계획 소식 속에 3.54% 강세를 기록했다."], ["Coupang", "중립~긍정", "뉴스 확인", "17.13달러\u003cbr\u003e+0.31달러 (+1.84%)", "", "", "", "[yfinance](https://finance.yahoo.com/markets/stocks/articles/coupang-fine-tests-data-privacy-170940380.html) 한국 정부 과징금 처분의 법적 리스크 분석 뉴스가 이어진 가운데 가격은 1.84% 반등했다."], ["Rocket Lab", "중립~긍정", "뉴스 확인", "109.25달러\u003cbr\u003e+6.86달러 (+6.70%)", "", "", "", "[yfinance](https://www.barrons.com/articles/rocket-lab-firefly-stock-price-upgrade-db4af93c?siteid=yhoof2\u0026yptr=yahoo) 최근 우주 섹터 매도세가 과도하다는 KeyBanc의 분석 및 투자등급 상향 조치에 힘입어 6.70% 급등했다."], ["Resolve AI", "중립~긍정", "뉴스 확인", "2.78달러\u003cbr\u003e+0.10달러 (+3.73%)", "", "", "", "[yfinance](https://finance.yahoo.com/markets/stocks/articles/rezolve-ai-taps-tcs-partnership-001429282.html) TCS 파트너십 구축 및 마이크로소프트 출신 베테랑 영입 효과 기대가 유지되며 3.73% 상승했다."], ["Intuitive Machines", "중립~부정", "뉴스 확인", "25.76달러\u003cbr\u003e-0.86달러 (-3.23%)", "", "", "", "[yfinance](https://247wallst.com/investing/2026/06/14/spacexs-ipo-was-enormously-successful-but-did-it-break-the-rest-of-the-space-industry/) SpaceX IPO의 우주 생태계 영향 분석이 지속되는 가운데 3.23% 하락 조정을 받았다."]]}, {"type": "heading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "대상: 하나금융지주, 우리금융지주, DB손해보험, SCHD.", "autoBold": true}, {"type": "paragraph", "text": "금융주 섹터는 코스피의 **8,700선 돌파 호재**와 동반하며 외국인 수급이 견고하게 유지되었습니다. 특히 **하나금융지주**는 7일간의 누적 수급 흐름이 증명하듯 외국인과 기관의 강력한 동반 매수세가 계속 유입되며 당일 **2.17% 상승한 132,100원**으로 신고가 랠리를 연장해 나갔습니다. 기업설명회(IR) 개최 등 주주 친화적인 정책 행보가 주가를 견인하고 있습니다.", "autoBold": true}, {"type": "paragraph", "text": "반면 **우리금융지주**는 당일 **0.31% 소폭 소폭 하락 조정**을 겪었습니다. 최근 고환율 장기화 기조 속에서 추가적인 자사주 매입 및 소각 여부가 자본적정성 관리의 핵심 변수로 부상했다는 소식이 보도되었습니다. 동사는 가격 흐름이 약세였으나 외국인의 대규모 매수세 유입(174억)이 낙폭을 최소화했습니다.", "autoBold": true}, {"type": "paragraph", "text": "**DB손해보험** 역시 AI 시스템 도입 등 기술 혁신 보도와 기관 매수 우위에도 불구하고 외국인의 42억 원 순매도가 출회되며 **0.92% 하락**했습니다. 미국의 **SCHD**는 장기 배당 자산 배분 다각화 뉴스 속에서 지수 약세 영향으로 **0.58%** 조정을 마쳤습니다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "대상: 현대차2우B, USD/KRW, 수출 또는 자동차 관련 신호.", "autoBold": true}, {"type": "paragraph", "text": "원/달러 환율은 직전 거래일의 하락 이후 다시 소폭 반등하여 **1,516.66원**으로 보합권에서 등락을 기록하고 있습니다. 환율의 추가적인 변동성이 현대차 등 수출 대형주에 다소 부담을 줄 수 있는 국면입니다.", "autoBold": true}, {"type": "paragraph", "text": "**현대차2우B**는 당일 **1.17% 하락한 254,000원**에 마감하며 조정을 보였습니다. 수급상으로는 **외국인이 140억 원의 강력한 순매수**를 보여주었으나, 기관의 매도 우위와 환율 불안 심리로 인해 주가는 약세를 나타냈습니다. 노조의 노동쟁의 신청 및 파업 리스크가 단기적인 상방 압력을 제한하고 있는 것으로 보이며, 향후 특수관계인 간 유가증권 거래 및 출자 공시 이행이 기업 펀더멘털과 지배구조에 미칠 장기적 영향을 세밀하게 주시해야 합니다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "대상: 삼성전자, Nvidia, SOXX/Nasdaq 관련 신호가 있는 경우.", "autoBold": true}, {"type": "paragraph", "text": "필라델피아 반도체 지수가 **5.45% 폭등**하고 나스닥이 **3.07% 강세**를 기록하는 등 글로벌 IT 반도체 랠리가 극에 달했습니다. 이에 따라 국내 대표주인 **삼성전자**는 **0.74% 상승한 339,500원**에 턱걸이했습니다. 하지만 수급 불안은 여전히 심각합니다. 당일에도 **외국인은 6,188억 원을 순매도**했고, **기관이 1,811억 원을 순매수**로 방어하는 등 방향성이 강하게 엇갈려 단기 매몰벽이 형성되었습니다.", "autoBold": true}, {"type": "paragraph", "text": "반면, PCB 기판 수혜주인 **이수페타시스**는 기관의 차익 매물이 일부 소화된 상황에서 외국인의 196억 원 순매수세가 복귀하며 **3.03% 상승 반등**에 성공했습니다. 미국의 **Nvidia**는 채권 발행을 통한 200억 달러 자금 조달 계획 및 AI 투자 둔화에 베팅하는 숏 세력과의 공방 속에 지수 강세와 맞물리며 **3.54% 상승**했습니다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "대상: SCHD, Apple, Nvidia, Coupang, Rocket Lab, Resolve AI, Intuitive Machines.", "autoBold": true}, {"type": "paragraph", "text": "미국 포트폴리오는 전날 SpaceX IPO 열풍으로 급락했던 우주 관련주들이 하루 만에 강한 반등세를 보이며 리스크를 상당 부분 회복했습니다.", "autoBold": true}, {"type": "paragraph", "text": "**Rocket Lab**은 KeyBanc의 분석처럼 '최근 우주 섹터의 대량 매도세는 펀더멘털과 무관한 과도한 반응(Unwarranted)'이라는 낙관적 업계 리포트와 투자 등급 상향에 힘입어 **6.70% 급등**해 109.25달러선에 복귀했습니다. 반면 **Intuitive Machines**는 SpaceX 독주 경계 심리가 남아 있어 **3.23% 추가 하락** 조정되었습니다.", "autoBold": true}, {"type": "paragraph", "text": "빅테크 대형주인 **Apple**은 M7 규제 우려 속에서도 나스닥 강세 기조에 동참하며 **1.82% 상승**했습니다. 사상 최대 과징금 처분 타격을 입었던 **Coupang** 역시 법적 대응 및 성장 훼손 여부에 대한 글로벌 논란 속에서 기술적 매수세가 유입되어 **1.84% 상승**했습니다. AI 소프트웨어 파트너십 확장에 속도를 내는 **Resolve AI**는 TCS 협력 소식의 온기가 지속되며 **3.73% 상승** 마감했습니다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "paragraph", "text": "* **현대차2우B**: 특수관계인 기타유가증권 매수 및 출자 공시 접수. 노조 협상 난항 및 파업 준비 뉴스 반영.", "autoBold": false}, {"type": "paragraph", "text": "* **하나금융지주**: 기업설명회(IR) 개최 공시. 유가 안정 및 지정학 리스크 완화에 따른 금융주 신고가 랠리 뉴스 보도.", "autoBold": false}, {"type": "paragraph", "text": "* **우리금융지주**: 고환율 상황 속에서 자사주 소각 계획 유지 및 추가 소각 한도 관련 금융당국 변수 뉴스.", "autoBold": false}, {"type": "paragraph", "text": "* **삼성전자**: 하반기 갤럭시 스마트폰 보안 기능 강화 뉴스 및 삼성 아트 TV 호텔용 라인업 확장 뉴스.", "autoBold": false}, {"type": "paragraph", "text": "* **DB손해보험**: 증권발행실적보고서 공시 제출. 블랙박스 영상 분석을 통한 5초 내 과실 판정 AI 시스템 최초 도입 보도.", "autoBold": false}, {"type": "paragraph", "text": "* **현대바이오**: 주요사항보고서(전환사채 CB 발행 결정) 공시 접수. 100억 규모 자금 조달 소식.", "autoBold": false}, {"type": "paragraph", "text": "* **금호석유화학**: 합성고무 중심에서 친환경 전기차 고부가가치 소재로의 사업 전환 가속화 관련 뉴스.", "autoBold": false}, {"type": "paragraph", "text": "* **이수페타시스**: 피지컬 AI 투자 및 고변동성 장세 대응용 채권혼합 운용 자금 유입 관련 뉴스.", "autoBold": false}, {"type": "paragraph", "text": "* **SCHD / AAPL / NVDA / CPNG / RKLB / RZLV / LUNR**: KeyBanc의 우주주 '과매도 부당' 분석 및 엔비디아의 200억 달러 채권 발행 계획, 쿠팡 개인정보 과징금 관련 해외 반응 뉴스 반영.", "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **우주 항공 테마의 반등 신뢰성 확인**: KeyBanc의 긍정적 전망으로 Rocket Lab이 강하게 반등한 만큼, 추가적인 매수세가 유입되며 110달러선을 지지선으로 고착화하는지 주시해야 합니다.", "autoBold": false}, {"type": "paragraph", "text": "2. **삼성전자의 외국인 매도 진정 여부**: 나스닥 3% 급등 온기가 무색하게 당일에도 6,000억 원 이상의 대량 매도를 쏟아낸 외국인의 엑소더스가 언제 멈추는지가 코스피 추가 상승의 관건입니다.", "autoBold": false}, {"type": "paragraph", "text": "3. **금융지주 추가 자사주 소각 이행**: 고환율 환경 속에서 자본 비율 방어를 위한 우리금융지주의 자사주 추가 소각 실현
