er-discusses-sell-off-082856790.html)에 따르면 크레이머의 매도 제안 및 SpaceX 첫날 급등에 따른 차익 매물 보도 속에 가격이 1.52% 하락했다."], ["**Nvidia**", "중립", "뉴스 확인", "205.19달러\u003cbr\u003e+0.32달러 (+0.16%)", "", "", "", "[모틀리풀](https://www.fool.com/investing/2026/06/15/ai-stock-hit-1-trillion-record-this-happens-next/)에 1조 달러 돌파 후 장기 전망 뉴스가 집중되었으며 가격은 0.16%의 미미한 보합 강세에 그쳤다."], ["**Coupang**", "중립~부정", "뉴스 확인", "16.82달러\u003cbr\u003e-0.43달러 (-2.49%)", "", "", "", "[Retail Insight](https://www.retail-insight-network.com/news/south-korea-fines-coupang-won624-68bn/) 보도에 따르면 한국 정부로부터 데이터 유출로 인한 6,246억 원 과징금 처분을 받아 리스크 우려가 작용하며 주가가 2.49% 하락했다."], ["**Rocket Lab**", "중립~부정", "뉴스 확인", "102.39달러\u003cbr\u003e-12.39달러 (-10.79%)", "", "", "", "[TheStreet](https://www.thestreet.com/investing/stocks/why-rocket-lab-stock-tumbled-on-nasdaq-100-news) 뉴스 분석처럼 Nasdaq-100 편입 호재에도 불구하고 단기 차익 실현 및 매물 폭탄으로 하루 만에 10.79% 급락했다."], ["**Resolve AI**", "중립~긍정", "뉴스 확인", "2.68달러\u003cbr\u003e+0.15달러 (+5.93%)", "", "", "", "[Simply Wall St](https://finance.yahoo.com/markets/stocks/articles/rezolve-ai-taps-tcs-partnership-001429282.html)에 TCS 파트너십 구축 및 3억 달러 규모 자사주 매입 계획이 호재로 부각되며 주가가 5.93% 상승했다."], ["**Intuitive Machines**", "중립~부정", "뉴스 확인", "26.62달러\u003cbr\u003e-4.02달러 (-13.12%)", "", "", "", "[모틀리풀](https://www.fool.com/investing/2026/06/13/space-stocks-got-crushed-on-spacexs-big-day-is-the/)에 따르면 SpaceX IPO 대흥행이 기존 우주 관련 상장사들의 단기 밸류에이션 부담으로 이어지며 13.12% 급락했다."]]}, {"type": "heading", "level": 2, "text": "3. 금융주 브리핑"}, {"type": "paragraph", "text": "대상: 하나금융지주, 우리금융지주, DB손해보험, SCHD.", "autoBold": true}, {"type": "paragraph", "text": "금융주 섹터는 중동 리스크 완화에 따른 코스피 랠리와 맞물려 **외국인 매수세**가 집중되며 동반 강세를 나타냈습니다. 특히 **하나금융지주**는 4대 금융지주 실적 개선 기대감과 함께 외국인(189억) 및 기관(109억)의 쌍끌이 순매수 지원 속에 **6.86% 급등**하여 129,300원에 도달했습니다. 동사는 기업설명회(IR) 개최 공시를 내놓으며 주주가치 제고 기대감을 고조시켰습니다.", "autoBold": true}, {"type": "paragraph", "text": "**우리금융지주** 또한 효성그룹 계열사에 대한 2조 원 금융지원 개시 보도와 영업이익경비율(CIR) 효율화 이슈 속에 외인(174억) 매수 유입으로 **4.49% 상승** 마감했습니다.", "autoBold": true}, {"type": "paragraph", "text": "반면, **DB손해보험**은 신한금융그룹과 공동으로 500억 원 규모의 첨단산업 신기술 펀드를 결성하는 등 호재가 잇따랐고 기관이 60억 원을 대거 순매수했으나, 외인이 42억 원어치를 출회하며 주가 상승률은 **2.83%**에 멈췄습니다. 미국 시장의 **SCHD**는 Barchart의 포트폴리오 다각화 뉴스 속에 장 분위기에 편승하며 **0.89%** 완만히 상승했습니다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "4. 현대차 / 환율"}, {"type": "paragraph", "text": "대상: 현대차2우B, USD/KRW, 수출 또는 자동차 관련 신호.", "autoBold": true}, {"type": "paragraph", "text": "당일 원/달러 환율은 직전 거래일 대비 **3.72원 하락한 1,513.66원**에 종가를 형성하여 시장 불안 심리를 다소 완화시켰습니다. 환율 안정이 우호적으로 작용한 가운데, **현대차2우B**는 당일 **6.64% 상승한 257,000원**으로 급등했습니다. 수급 측면에서는 기관이 5억 원의 미미한 순매도를 보였으나, **외국인이 140억 원의 대량 순매수**를 집행하며 주가 상승의 독보적인 동력이 되었습니다.", "autoBold": true}, {"type": "paragraph", "text": "DART 공시로는 특수관계인인 현대자동차 계열사로부터의 기타유가증권 매수 및 특수관계인에 대한 출자 등 내부 투자 관련 공시 2건이 확인되었습니다. 노조가 중앙노동위원회에 노동쟁의 조정을 신청하며 파업 수순에 돌입했다는 우려 뉴스가 보도되었음에도 불구하고, 대형 수출주에 대한 외인의 적극적인 수급 유입이 악재를 상쇄한 모습을 보였습니다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "5. 반도체 브리핑"}, {"type": "paragraph", "text": "대상: 삼성전자, Nvidia, SOXX/Nasdaq 관련 신호가 있는 경우.", "autoBold": true}, {"type": "paragraph", "text": "미국 필라델피아 반도체 지수가 **1.52% 상승**하고 나스닥 지수가 0.31% 상승 마감하는 등 해외 반도체 온기가 국내 증시에도 반영되었습니다. **삼성전자**는 당일 **4.50% 상승한 337,000원**에 안착했습니다. 그러나 수급 면에서는 **기관이 1,811억 원을 순매수**하며 지수를 지탱한 반면, **외국인은 6,188억 원을 대량 순매도**하는 등 가격 상승세와 외국인 수급이 강하게 엇갈리는 수급 불안 양상을 노출했습니다. 뉴스 측면에서는 미래에셋증권의 프리미엄 부합 리서치 분석과 TV 낙하시험 기간을 대폭 축소하는 AX '디지털 트윈' 인프라 본격 기동 소식이 전해졌습니다.", "autoBold": true}, {"type": "paragraph", "text": "미국 증시의 **Nvidia**는 시가총액 1조 달러 달성 이후 후속 성장에 대한 장기 낙관론 속에 **0.16%** 보합세를 기록했습니다. 한편, AI 인프라 관련 여의도 고수들의 유망 기업으로 지목된 PCB 전문업체 **이수페타시스**는 외인의 196억 원 순매수에도 불구하고, 단기 급등에 부담을 느낀 **기관이 1,009억 원을 투하**하며 차익 매물을 쏟아낸 탓에 **2.86% 하락**했습니다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "6. 미국 포트폴리오 브리핑"}, {"type": "paragraph", "text": "대상: SCHD, Apple, Nvidia, Coupang, Rocket Lab, Resolve AI, Intuitive Machines.", "autoBold": true}, {"type": "paragraph", "text": "미국 포트폴리오는 개별 종목별 이슈가 시장 분위기를 압도하며 높은 변동성을 기록했습니다.", "autoBold": true}, {"type": "paragraph", "text": "**Apple**은 짐 크레이머의 매도 논의 뉴스 및 대형주 전반의 매물 부담 속에 **1.52% 하락**했습니다. 이커머스 강자 **Coupang**은 한국 공정위로부터 개인정보 유출 관련 사상 최대 규모인 **6,246억 원 규모의 과징금 부과** 처분을 받았다는 악재 뉴스가 대대적으로 전해지며 주가가 **2.49% 하락**하는 등 타격을 받았습니다.", "autoBold": true}, {"type": "paragraph", "text": "특히 우주/항공 테마주들은 초대형 플레이어인 **SpaceX의 성공적인 상장(IPO)** 첫날 급등 여파로 밸류에이션 부담이 가중되며 직격탄을 맞았습니다. **Rocket Lab**은 Nasdaq-100 편입 뉴스에도 불구하고 하루 만에 **10.79% 급락**했으며, **Intuitive Machines** 역시 SpaceX가 민간 우주 시장을 독식할 것이라는 우려와 함께 **13.12% 폭락**을 면치 못했습니다.", "autoBold": true}, {"type": "paragraph", "text": "반면, AI 설루션 업체인 **Resolve AI**는 TCS 파트너십 구축 및 3억 달러 규모의 자사주 매입 계획 발표에 힘입어 **5.93% 급등**하며 고유 호재에 힘입어 차별화된 흐름을 지켜냈습니다.", "autoBold": true}, {"type": "heading", "level": 2, "text": "7. 공시 및 뉴스"}, {"type": "paragraph", "text": "* **현대차2우B**: 현대자동차가 특수관계인으로부터 기타유가증권 매수 및 특수관계인에 대한 출자 공시 제출. 노조의 노동쟁의 조정 신청으로 파업 수순 돌입 보도.", "autoBold": false}, {"type": "paragraph", "text": "* **하나금융지주**: 기업설명회(IR) 개최 공시 및 임원 지분 소유 상황 보고. 미국-이란 종전 소식에 따른 코스피 8,500선 돌파 뉴스 및 4대 금융지주 실적 개선 기대감 부각.", "autoBold": false}, {"type": "paragraph", "text": "* **우리금융지주**: 효성그룹 계열사에 2조 원 금융지원을 개시하는 '미래동반성장' 프로젝트 뉴스 및 1분기 영업이익경비율(CIR) 50% 상회 효율 관리 고심 뉴스.", "autoBold": false}, {"type": "paragraph", "text": "* **삼성전자**: 최대주주 소유주식 변동 신고서 및 임원(박태훈) 지분 보고 공시 접수. 폴스텍 제조 내재화 역량 관련 평가 및 가전·모바일 검증 단축용 DX 디지털 트윈 가동 뉴스.", "autoBold": false}, {"type": "paragraph", "text": "* **DB손해보험**: 증권발행실적보고서 및 투자설명서 공시 제출. 신한금융그룹과 첨단 기술 투자를 위한 500억 규모 신기술펀드 결성 동맹 소식.", "autoBold": false}, {"type": "paragraph", "text": "* **현대바이오**: 100억 원 규모의 사모 전환사채(CB) 발행 결정 공시 접수. 확보 자금은 페니트리움바이오사이언스 주식 취득자금으로 사용될 예정.", "autoBold": false}, {"type": "paragraph", "text": "* **금호석유화학**: 이란 원유 공급 확대에 따른 에틸렌 스프레드 정상화 기대감 뉴스 및 글로벌 ESG 평가기관 MSCI로부터 ESG 'A 등급'을 획득했다는 뉴스 보도.", "autoBold": false}, {"type": "paragraph", "text": "* **이수페타시스**: AI 인프라 수혜주로서 여의도 센터장들이 꼽은 돈 버는 종목 리스트 부각 뉴스.", "autoBold": false}, {"type": "paragraph", "text": "* **SCHD / AAPL / NVDA / CPNG / RKLB / RZLV / LUNR**: SpaceX IPO 첫날 20% 급등 영향에 따른 우주 기업 급락 뉴스 및 쿠팡 6,246억 원 데이터 과징금 뉴스, Rezolve AI의 자사주 매입 및 TCS 파트너십 뉴스 반영.", "autoBold": false}, {"type": "heading", "level": 2, "text": "8. 오늘의 관찰 포인트"}, {"type": "paragraph", "text": "1. **현대차 파업 현실화 여부와 수급 변화**: 노조의 조정 신청 결과와 조합원 파업 투표 흐름 속에서, 당일 140억 원을 쓸어 담은 외국인의 매수 기조가 유지되는지 관찰이 필요합니다.", "autoBold": false}, {"type": "paragraph", "text": "2. **쿠팡 과징금 항소 및 시장 영향**: 6,246억 원 규모의 개인정보 과징금 폭탄이 실적 가이던스에 미칠 영향과 뉴욕 증시 내 쿠팡 주가의 단기 지지선(16.5달러 부근) 확보 여부를 점검해야 합니다.", "autoBold": false}, {"type": "paragraph", "text": "3. **SpaceX IPO 후폭풍과 중소 우주주 반등 여부**: SpaceX 독주 우려로 급락한 Rocket Lab(100달러 선 붕괴 우려)과 Intuitive Machines(26달러 선 지지 여부)가 지나친 낙폭 과대 인식 속에 저가 매수세를 유입시킬지 주시해야 합니다.", "autoBold": false}, {"type": "paragraph", "text": "4. **삼성전자의 외국인 매도 공방**: 기관의 강력한 방어로 주가가 4.5% 상승했으나 하루 만에 6,188억 원을 털어낸 외인의 대규모 매도 기조가 진정되는지 여부.", "autoBold": false}, {"type": "heading", "level": 2, "text": "9. 데이터 품질"}, {"type": "list", "items": ["**KRX API 호출 누락**: 로컬 구동 시 `KRX_AUTH_KEY` 누락으로 인하여 `krx_open_api` 및 `krx_investor_flows` 수집 태스크가 skipped 되었습니다. 다만, 백업 엔진인 `pykrx_fallback` 모듈을 통해 포트폴리오 가격 데이터 및 기관/외인 거래소 거래 내역 수급 데이터는 누락 없이 정상 반영되었습니다."], "autoBold": false}, {"type": "list", "items": ["**해외 주식 수급 누락**: yfinance 수집 소스 특성상 미국 종목(SCHD, AAPL, NVDA, CPNG, RKLB, RZLV, LUNR)의 개별 기관/외인 거래소 유입 수급 정보는 지원되지 않아 공란 처리되었습니다."], "autoBold": false}, {"type": "list", "items": ["**Tier 3 공시 추적**: `portfolio.yaml` 설정에 따라 Tier 3 보유 종목 중 현대바이오는 `track_disclosure: true` 옵션이 적용되어 DART 공시(전환사채권 발행 등 2건)가 차질 없이 추적 및 수집 완료되었습니다."], "autoBold": false}]}, "view_model": {"schema": "kss-view-model.v1", "date": "2026-06-15", "as_of": "2026-06-15T18:29:29.865903+09:00", "timezone": "Asia/Seoul", "market_status": {"label": "중립", "score": 0, "reasons": [], "reason": ""}, "market_indicators": [{"name": "KOSPI", "symbol": "^KS11", "source": "yfinance", "as_of_date": "2026-06-15", "display_order": 0, "unit": "index", "risk_tags": ["시장 강세"], "short
